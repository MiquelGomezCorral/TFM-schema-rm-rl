<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Implemented ARM-FM reproduction pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,.08);
      --rule: rgba(45,49,66,.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 40px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main { width: min(1280px, 100%); margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 8px/1 var(--mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font: 400 40px/1.1 var(--serif);
      letter-spacing: -.02em;
    }
    .subtitle { margin-bottom: 20px; color: var(--muted); font-size: 14px; }
    .canvas { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1000px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · ARM-FM reproduction</p>
    <h1>Implemented ARM-FM pipeline</h1>
    <p class="subtitle">Two Reward Machine generators feed the same labeling, language, training, and evaluation path.</p>
    <div class="canvas">

        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- Zones -->

        <rect x="252" y="72" width="200" height="18" rx="2" fill="#f5f5f5"/>
        <text x="352" y="85" text-anchor="middle" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" font-weight="500" letter-spacing="1.4">RM GENERATION</text>

        <!-- Connectors: drawn before nodes -->
        <path d="M 200 304 H 220 Q 228 304 228 296 V 208 Q 228 200 236 200 H 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="704" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>

        <text x="730" y="357" text-anchor="middle" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".5">EXECUTE</text>

          <text x="352" y="434" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Improved RM</text>
          <text x="352" y="454" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">compiler + critics</text>
        </g>

          <text x="610" y="326" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">RM · labels · state text</text>

        <g>

          <text x="850" y="162" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">four-way correctness</text>
        </g>
        <g>

          <text x="850" y="306" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">State embeddings</text>
          <text x="850" y="326" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">frozen Qwen · normalized</text>
        </g>
        <g>
          <rect x="760" y="436" width="180" height="80" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
          <text x="850" y="470" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">RM runtime</text>
          <text x="850" y="490" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">full labels · one update/step</text>

        <g>

          <text x="1090" y="306" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Native learners</text>
          <text x="1090" y="326" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">DQN · Rainbow · PPO · SAC</text>
        </g>
        <g>
          <rect x="1000" y="436" width="180" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
          <text x="1090" y="470" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Frozen evaluation</text>
          <text x="1090" y="490" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">return · RM state · metrics</text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,.12)"/>
        <text x="40" y="672" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1.2">LEGEND</text>

        <text x="340" y="671" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">pipeline component</text>
        <line x1="492" y1="667" x2="530" y2="667" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <text x="544" y="671" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">artifact or runtime flow</text>

  </main>

</html>
