# X1 confirm: the best setting on a third seed (seed 3), both pilot cards. The base setting's seed 3
# is in the x1-base suite. s07 (round 1) is run here early, while round 1's last runs left slots idle;
# a different round 2 winner is added as a learner below and run later.
# Run: experiments/benchmark/scripts/train.sh tuning/ppo/confirm --parallel 6 --max-ram-gb 12
suite: x1-confirm
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles
learner: s07
compare_learners: [s07]
learners:
  s07: # L+U+E+S: lr 1e-3, minibatches 16, epochs 10, envs 16, rollout 256 (same as round 1)
    config: experiments/benchmark/configs/ppo.yaml
    ram_gb: 2.4
    overrides:
      ppo_learning_rate: 1.0e-3
      ppo_num_minibatches: 16
      ppo_update_epochs: 10
      ppo_num_envs: 16
      ppo_num_steps: 256
arms: [farm]
seeds: [3]
total_timesteps: 500000
time_box_min: 30
only: [base-unlock-pickup, base-doorkey]
variants: []
