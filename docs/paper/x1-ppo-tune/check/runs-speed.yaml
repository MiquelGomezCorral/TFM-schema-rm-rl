# X1 speed check: the pilot DQN and the best PPO setting (s07) on UnlockPickup seed 1, started at the
# same time on the same machine, so both see the same load. The pilot's 14.7 min for DQN was measured
# with 4 runs at once; wall times of the other X1 suites were measured with X2 and C3 on the machine.
# s07 on seed 1 also repeats its round 1 run, a determinism check of the eval rows.
# Run: experiments/benchmark/scripts/train.sh tuning/ppo/speed --parallel 2 --max-ram-gb 6.4
suite: x1-speed
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles
learner: dqn
compare_learners: [dqn, s07]
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 4, overrides: {buffer_size: 100000}}
  s07:
    config: experiments/benchmark/configs/ppo.yaml
    ram_gb: 2.4
    overrides:
      ppo_learning_rate: 1.0e-3
      ppo_num_minibatches: 16
      ppo_update_epochs: 10
      ppo_num_envs: 16
      ppo_num_steps: 256
arms: [farm]
seeds: [1]
total_timesteps: 500000
time_box_min: 40
only: [base-unlock-pickup]
variants: []
