# X1 base evidence: the exact pilot PPO setting (configs/ppo.yaml, CleanRL MiniGrid values) on the
# two pilot cards, FARM machines, 500k steps. Seed 1 must reproduce the pilot (DoorKey solved,
# UnlockPickup not); seeds 2 and 3 give the reference for the tuned settings.
# Run: experiments/benchmark/scripts/train.sh tuning/ppo/base --parallel 6 --max-ram-gb 12
suite: x1-base
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 2.4}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 500000
time_box_min: 30
only: []
variants: []
