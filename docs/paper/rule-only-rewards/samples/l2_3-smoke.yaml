# L2.3 smoke run: DoorKey 5x5, DQN, symbolic view, the generated compiler bundle, success judged by the RM.
# Not a learning run: the smallest budget that trains and evaluates. Replace BUNDLE_DIR with the absolute bundle folder
# (README: sed "s#BUNDLE_DIR#$E/bundle#" ...). Pass the seed with --seed.
exp_name: l2-3-smoke
gym_id: MiniGrid-DoorKey-5x5-v0
env_family: minigrid
observation: symbolic
layout: fixed
bundle: BUNDLE_DIR
success: rm

total_timesteps: 3000
learning_starts: 1000
eval_frequency: 1500
learning_rate: 1.0e-4
buffer_size: 3000
gamma: 0.99
tau: 1.0
target_network_frequency: 500
batch_size: 32
start_e: 1.0
end_e: 0.05
exploration_fraction: 0.5
train_frequency: 4

eval_episodes: 5
final_eval_episodes: 10
eval_epsilon: 0.0
success_threshold: 0.9
