# order-cards packet, Part 4: the templates suite config (experiments/benchmark/templates/runs.yaml) cut to one
# card and the FARM and no-RM arms (no ARM-FM). The suite name stays `templates`, so the run folders are the ones
# the full suite run would use and skip.
suite: templates
tasks: experiments/benchmark/templates/tasks.json
bundles: experiments/benchmark/templates/bundles
learner: ppo
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, farm]
seeds: [1, 2, 3]
total_timesteps: 1500000
only: [tpl-response-1-goal]
variants: []
