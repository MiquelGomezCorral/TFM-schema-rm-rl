# The forcing suite (experiments/benchmark/forcing/runs.yaml) cut to the lanes-rules card and seed 1:
# the two runs copied into tp-checks-fix/outputs/runs and re-judged there (live check of 2026-11-20).
suite: forcing
tasks: experiments/benchmark/forcing/tasks.json
bundles: experiments/benchmark/forcing/bundles
learner: ppo
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, farm]
seeds: [1]
total_timesteps: 1500000
only: [lanes-rules]
variants: []
