  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", linkMedia); else linkMedia();

  document.addEventListener("click", (e) => {
    const opener = e.target.closest?.(VIEWER_OPENERS);
    if (opener) openViewer(opener);
  });
  // Capture, so the keys a figure opens with and the viewer's own keys never reach the deck.
  document.addEventListener("keydown", (e) => {
    if (viewerDialog.open) {
      const actions = {
        ArrowLeft: () => stepViewer(-1),
        ArrowRight: () => stepViewer(1),
        "+": () => zoomViewer(viewer.scale * 1.5),
        "=": () => zoomViewer(viewer.scale * 1.5),
        "-": () => zoomViewer(viewer.scale / 1.5),
        "_": () => zoomViewer(viewer.scale / 1.5),
        "0": resetViewerZoom,
      };
      if (!actions[e.key]) return;
      e.preventDefault();
      e.stopPropagation();
      actions[e.key]();
      return;
    }
    if (!["Enter", " "].includes(e.key)) return;
    const opener = e.target.closest?.(VIEWER_OPENERS);
    if (!opener) return;
    e.preventDefault();
    e.stopPropagation();
    openViewer(opener);
  }, true);

  // Every wheel over the viewer belongs to the viewer, so the page behind never scrolls; a plot keeps its own.
  viewerDialog.addEventListener("wheel", (e) => {
    e.preventDefault();
    const point = viewerPoint(e.clientX, e.clientY);
    zoomViewer(viewer.scale * Math.exp(-e.deltaY / 300), point.x, point.y);
  }, { passive: false });

  viewerDialog.addEventListener("pointerdown", (e) => {
    viewerBackdrop = e.target === viewerDialog || e.target === viewerStage;
    // A press on the media drags it; a press anywhere else is a close or a control.
    if (viewerBackdrop || !viewer.media?.element.contains(e.target) || viewer.media.copy) return;
    viewerPointers.set(e.pointerId, viewerPoint(e.clientX, e.clientY));
    viewerDialog.setPointerCapture(e.pointerId);
    if (viewerPointers.size === 2) viewerPinch = viewerPinchInfo();
  });
  viewerDialog.addEventListener("pointermove", (e) => {
    const from = viewerPointers.get(e.pointerId);
    if (!from) return;
    const point = viewerPoint(e.clientX, e.clientY);
    viewerPointers.set(e.pointerId, point);
    if (viewerPointers.size > 1) {
      const pinch = viewerPinchInfo();
      if (viewerPinch?.distance) {
        viewer.tx += pinch.x - viewerPinch.x;
        viewer.ty += pinch.y - viewerPinch.y;
        zoomViewer(viewer.scale * (pinch.distance / viewerPinch.distance), pinch.x, pinch.y);
      }
      viewerPinch = pinch;
      return;
    }
    if (viewer.scale > 1) {
      viewer.tx += point.x - from.x;
      viewer.ty += point.y - from.y;
      clampViewerPan();
      applyViewerTransform();
    }
  });
  // A press and a release both on the backdrop closes; a drag that merely ends there does not.
  const endPointer = (e) => {
    viewerPointers.delete(e.pointerId);
    if (viewerPointers.size < 2) viewerPinch = null;
  };
  viewerDialog.addEventListener("pointerup", (e) => {
    endPointer(e);
    if (viewerBackdrop && (e.target === viewerDialog || e.target === viewerStage)) closeViewer();
    viewerBackdrop = false;
  });
  viewerDialog.addEventListener("pointercancel", endPointer);
  // An image is natively draggable, and the capture would turn a drag into a cancelled pointer.
  viewerStage.addEventListener("dragstart", (e) => e.preventDefault());
  // The capture sends the gesture's double-click to the dialog, so the reset listens there and skips its own buttons.
  viewerDialog.addEventListener("dblclick", (e) => { if (!e.target.closest("[data-viewer]")) resetViewerZoom(); });

  viewerDialog.addEventListener("click", (e) => {
    const action = e.target.closest?.("[data-viewer]")?.dataset.viewer;
    if (action === "close") closeViewer();
    else if (action === "prev") stepViewer(-1);
    else if (action === "next") stepViewer(1);
    else if (action === "in") zoomViewer(viewer.scale * 1.5);
    else if (action === "out") zoomViewer(viewer.scale / 1.5);
  });
  viewerDialog.addEventListener("close", () => {
    unmountViewerMedia();
    viewer.items = [];
    viewer.pair = null;
    viewerPointers.clear();
    viewerPinch = null;
    viewerBackdrop = false;
    viewer.opener?.focus({ preventScroll: true });
    viewer.opener = null;
  });

  new MutationObserver(rethemeViewer).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  systemDark.addEventListener("change", rethemeViewer);
}

// The saved choice applies to every artifact; without one the page follows the system theme.
function wireTheme(bar) {
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem(themeKey);
    if (saved) root.dataset.theme = saved;
  } catch { /* storage blocked */ }
  const isDark = () => currentTheme() === "dark";
  const button = document.createElement("button");
  button.type = "button";
  const showTarget = () => {
    button.textContent = isDark() ? "\u2600\uFE0E" : "\u263E";
    button.title = `Switch to ${isDark() ? "light" : "dark"} mode`;
    button.setAttribute("aria-label", button.title);
    themeFrames(isDark() ? "dark" : "light");
  };
  button.addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem(themeKey, root.dataset.theme); } catch { /* storage blocked */ }
    showTarget();
  });
  systemDark.addEventListener("change", showTarget);
  showTarget();
  bar.append(button);
}

function wireSlides(bar) {
  document.body.classList.add("slides");
  const slides = [...document.querySelectorAll(".slide")];
  bar.insertAdjacentHTML("afterbegin", '<button type="button" data-step="-1" title="Previous slide" aria-label="Previous slide">‹</button><span></span><button type="button" data-step="1" title="Next slide" aria-label="Next slide">›</button>');
  let current = Math.min(Number(location.hash.slice(1)) || 0, slides.length - 1);
  const show = (index) => {
    current = Math.max(0, Math.min(index, slides.length - 1));
    slides.forEach((s, i) => s.classList.toggle("on", i === current));
    bar.querySelector("span").textContent = `${current + 1} / ${slides.length}`;
    history.replaceState(null, "", "#" + current);
  };
  bar.addEventListener("click", (e) => { if (e.target.dataset.step) show(current + Number(e.target.dataset.step)); });
  document.addEventListener("keydown", (e) => {
    if (viewerDialog.open) return; // the viewer owns the keys while it is open
    if (e.target.matches("textarea, input") || (e.key === " " && e.target.closest("button"))) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(current + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
  });
  show(current);
}

document.title = data.title || "Artifact";
document.body.insertAdjacentHTML("afterbegin", renderBar());
document.getElementById("root").innerHTML = renderHeader() + (data.sections || []).map(renderSection).join("");
markChangedItems();
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-only-changes]")) return;
  document.body.classList.toggle("only-changes", e.target.checked);
  if (e.target.checked) document.querySelectorAll("section:is([data-change], :has([data-change])) > details.sec").forEach((d) => { d.open = true; });
});
// Highlights toggle by reload, so off renders the version as a new page would: no marks, collapsed sections shut.
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-highlights]")) return;
  const off = !e.target.checked;
  if (saveState(highlightsOffKey, off ? { version: data.version } : {})) return location.reload();
  e.target.checked = off; // the save failed, so the box goes back to what the page shows
  const row = e.target.closest(".change-tools");
  if (!row.querySelector(":scope > .pill.warn")) row.insertAdjacentHTML("beforeend", '<span class="pill warn" role="status">Not saved: this browser blocks page storage, so highlights stay on</span>');
});
// Any section holding picks, even inside collapsible rows, ends with the copy bar.
for (const section of document.querySelectorAll("section")) {
  if (!section.querySelector(".decision, table.pick")) continue;
  (section.querySelector(":scope > details.sec") || section).insertAdjacentHTML("beforeend", '<div class="copy-bar"><button type="button" data-copy-decisions>Copy my decisions</button> <span class="copy-status" hidden></span><pre class="copy-text" hidden></pre></div>');
}
// A link to a section or sub-section, from the Contents index or anywhere on the page, unfolds it before the jump.
const unfold = (hash) => {
  let id = hash.slice(1);
  try { id = decodeURIComponent(id); } catch { /* a stray "%" stays as typed */ }
  const fold = id && document.getElementById(id)?.closest("section")?.querySelector(":scope > details.sec");
  if (fold) fold.open = true;
};
document.addEventListener("click", (e) => { const link = e.target.closest('a[href^="#"]'); if (link) unfold(link.getAttribute("href")); });
addEventListener("hashchange", () => unfold(location.hash));
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-fold]");
  if (button) document.querySelectorAll("details.sec").forEach((d) => { d.open = button.dataset.fold === "open"; });
});
unfold(location.hash);
const toolbar = document.createElement("div");
toolbar.className = "toolbar";
document.body.append(toolbar);
wireTheme(toolbar);
// Printing shows every row and section open and every frame loaded; afterprint shuts again what was shut.
// Ctrl+P prints the screen theme and does no frame preparation; Export PDF prepares first (see exportPdf).
addEventListener("beforeprint", openForPrint);
addEventListener("afterprint", restoreAfterPrint);
wireExports();
wireDecisions();
wireChipTips();
wireSteps();
wireViewer();
wireContents();
if (data.layout === "slides") wireSlides(toolbar);
// A page rewritten during a long run reloads itself, at most daily. A reload would undo what the
// reader opened or folded, so a tick is skipped while a row they opened is open or one they folded is shut, "Show only changes" is on,
// a textarea has focus, or a video is playing; the next tick tries again.
const refreshSeconds = Number(data.refresh);
if (refreshSeconds >= 10) {
  const openAtLoad = new Set(document.querySelectorAll("details[open]"));
  const readerIsBusy = () => document.body.classList.contains("only-changes")
    || viewerDialog.open
    || document.activeElement?.matches("textarea")
    || document.documentElement.classList.contains("print-layout")
    || [...document.querySelectorAll("video")].some((v) => !v.paused)
    || [...document.querySelectorAll("details")].some((d) => d.open !== openAtLoad.has(d));
  setInterval(() => { if (!readerIsBusy()) location.reload(); }, Math.min(refreshSeconds, 86400) * 1000);
}
</script>
</body>
