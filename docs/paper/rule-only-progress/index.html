          "type": "list",
          "heading": "Where kept and broken episodes still end close",
          "items": [
            "**A promise left open costs 0.1.** In Response, RespondedExistence and ChainResponse, the kept trace totals 0 and the trace left open at the end totals -0.1 (`x - -`, `x -`, `- x`). Today both total 0. The box that stays on the floor until the episode ends costs 0.1, the same as a power cut that never gets its generator.",
            "**Fixing late costs nothing.** `x y` and `x - - y` both total 0. Only the learner's discount prices the wait: a fix 50 steps late loses about 0.039 (0.1 × (1 − 0.99^50), computed, not measured).",
            "**A break the compiler already prices keeps its price.** Soft ChainResponse: broken is -0.5 today and -0.5 with P2 (-0.1, -0.4, 0). Hard ChainResponse: broken is -1 today and -1.1 with P2; the extra 0.1 is the step where the alarm rings.",
            "**Soft goals get 0.1, nothing more.** Soft Existence done = +0.1, done twice = +0.1, not done = 0. Soft ExistenceTwo: one of two = +0.1, both = +0.2, a third time = 0. The +1 for finishing needs a hard goal."
          ]

          "type": "list",
          "heading": "Surprises",
          "items": [
            "**Hard and soft are the same machine for Response and RespondedExistence.** Both can always be repaired, so no state is ever violated; today and with P2 the two compile to identical text. \"You must\" and \"preferably\" pay the same.",
            "**The trigger step is charged.** In Response, `x` costs -0.1 the moment it happens, before anything is wrong. The kept trace nets 0 only because the answer pays it back; a run that never triggers the rule also totals 0. This is why the examples use events the environment causes: a trigger the agent controls would look like a cost to avoid.",
            "**Breaking a rule pays the 0.1 too.** A violated state counts as a target, like a kept one. In soft ChainResponse the break edge reads -0.4: the -0.5 charge plus +0.1 for getting there.",
            "**Absence, Precedence and NotCoExistence are untouched,** so after P2 two kinds of rule sit on different scales: rules that wait are priced in tenths, rules that forbid keep -0.5 or the well."
          ]

   (--page-w) fills the printable width. Worked once, for --page-w = 1060px: 1060px = 280.46mm of content; a 12mm A4 margin
   scales by the same 1/0.663 to 18.1mm; the sheet is 280.46 + 2 x 18.1 = 316.66mm wide (Chrome rounds it to whole points:
   measured about 316.4 x 447.7mm) and 316.66 x 297 / 210 = 447.8mm high, A4's shape. Scaled to A4 the text is about 7.5pt.

<!-- The viewer: a figure's own media, moved in and zoomed. Closed until a figure opens it; a plot's maximize button
     opens a fresh copy of its frame instead. -->
<dialog id="viewer" aria-label="Figure viewer">
<div id="viewer-stage"></div>
<div class="viewer-tools"><button type="button" data-viewer="out" title="Zoom out" aria-label="Zoom out">−</button><button type="button" data-viewer="in" title="Zoom in" aria-label="Zoom in">+</button><button type="button" data-viewer="close" title="Close" aria-label="Close">✕</button></div>

<!-- Page data to Markdown. It reads no DOM and shares nothing with the script below except these globals, so
     fill.py --markdown runs this script alone in Node and gets the same text as the page's export buttons. -->
<script id="markdown-converter">
"use strict";
const DEFAULT_STATUSES = {
  ok: { label: "As expected", tone: "ok" },
  bad: { label: "Not as expected", tone: "bad" },
  decide: { label: "Needs decision", tone: "warn" },
  info: { label: "Info", tone: "info" },
};

// How a figure is shown: "mermaid" when it has Mermaid text, else by the extension of the `src` path without its
// ?query or #hash. The renderer, referencedFiles() and the Markdown rules below all decide with this.
function figureKind(f) {
  if (f.mermaid) return "mermaid";
  const path = String(f.src || "").split(/[?#]/)[0];
  if (/\.(mp4|webm)$/i.test(path)) return "video";
  return /\.html?$/i.test(path) ? "frame" : "image";
}

// The items of a stats block: its own, plus finding counts when `auto`.
function statItems(data, block) {
  const items = [...(block.items || [])];
  if (!block.auto) return items;
  const statuses = data.statuses || DEFAULT_STATUSES;
  const findings = (data.sections || []).flatMap((s) => s.blocks || []).filter((b) => b.type === "findings").flatMap((f) => f.items || []);
  items.unshift({ value: findings.length, label: "Total" });
  for (const [key, status] of Object.entries(statuses)) {
    const count = findings.filter((f) => f.status === key).length;
    if (count) items.push({ value: count, label: status.label, tone: status.tone });
  }
  return items;
}

// Two modes. File mode keeps paths as the page writes them and folds rows in <details>, for a .md that
// travels with the page's files. Plain mode (`plain`) is for pasting into a chat: no paths, no HTML tags,
// every figure one `[figure: caption]` line. `picks` is the reader's saved state, { [decision id]: { choice, note } }.
function pageToMarkdown(data, { plain = false, picks = {} } = {}) {
  const statuses = data.statuses || DEFAULT_STATUSES;
  const statusLabel = (key) => statuses[key]?.label ?? key;

  const flat = (text) => String(text ?? "").replace(/\s*\n\s*/g, " ").trim();
  // The inline syntax is already Markdown. Plain mode drops <u> and links to relative files.
  const prose = (text) => {
    const md = String(text ?? "").replace(/\r\n?/g, "\n").trim();
    if (!plain) return md;
    return md.replace(/!\[([^\]]*)\]\([^)]*\)/g, (_, alt) => `[figure${alt && ": " + alt}]`)
      .replace(/<\/?u>/g, "").replace(/\[([^\]]+)\]\((?![a-z][a-z0-9+.-]*:)[^)]*\)/gi, "$1");
  };
  const quote = (md) => md.split("\n").map((line) => (line ? "> " + line : ">")).join("\n");
  // A list item: the marker, then every following line indented under it.
  const bullet = (md, marker = "- ") => marker + md.replace(/\n(?!\n|$)/g, "\n" + " ".repeat(marker.length));
  const heading = (level, text) => "#".repeat(Math.min(level, 6)) + " " + flat(prose(text));
  const fence = (text, lang = "") => {
    const longest = Math.max(0, ...(String(text).match(/`+/g) || []).map((run) => run.length));
    const mark = "`".repeat(Math.max(3, longest + 1));
    return `${mark}${lang}\n${String(text).replace(/\n+$/, "")}\n${mark}`;
  };
  const target = (path) => String(path).replace(/[ ()]/g, (c) => "%" + c.charCodeAt(0).toString(16).toUpperCase());
  // <summary> holds HTML, so its text is escaped and only code, bold and italic survive.
  const summaryHtml = (text) => flat(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*/g, (_, code, bold, em) => code ? `<code>${code}</code>` : bold ? `<b>${bold}</b>` : `<i>${em}</i>`);

  // A chip is its text, with its tone in parentheses when it has one.
  const chipText = (c) => c !== null && typeof c === "object" ? (c.tone ? `${c.text} (${c.tone})` : String(c.text ?? "")) : String(c ?? "");
  const cell = (text) => prose(text).replace(/\|/g, "\\|").replace(/\n/g, plain ? " " : "<br>");
  const table = (head, rows) => {
    const line = (cells) => `| ${cells.map(cell).join(" | ")} |`;
    return [line(head), line(head.map(() => "---")), ...rows.map(line)].join("\n");
  };
  const list = (items, ordered) => (items || []).map((item, n) => {
    const { text, items: kids, ordered: kidsOrdered } = typeof item === "string" ? { text: item } : item;
    const marker = ordered ? `${n + 1}. ` : "- ";
    const nested = kids?.length ? "\n" + list(kids, kidsOrdered).replace(/^/gm, " ".repeat(marker.length)) : "";
    return bullet(prose(text), marker) + nested;
  }).join("\n");

  const blocks = (items, depth) => (items || []).map((b) => block(b, depth)).filter(Boolean).join("\n\n");

  // A details row: foldable HTML in file mode, a bold title over a blockquote in plain mode.
  const row = ({ title, preview, text, blocks: inner }, depth) => {
    const body = [preview && `*${flat(prose(preview))}*`, text && prose(text), blocks(inner, depth + 1)].filter(Boolean).join("\n\n");
    if (plain) return [`**${flat(prose(title))}**`, body && quote(body)].filter(Boolean).join("\n\n");
    return `<details><summary>${summaryHtml(title)}</summary>\n\n${body ? body + "\n\n" : ""}</details>`;
  };

  const figure = (b, depth) => {
    const caption = flat(prose(b.caption || b.alt));
    const fold = b.details && row({ title: b.details.title || "Details", text: b.details.text, blocks: b.details.code ? [{ type: "code", text: b.details.code }] : [] }, depth);
    let media = `[figure${caption && ": " + caption}]`;
    // GitHub and most Markdown viewers draw a mermaid fence, so the diagram travels as its text.
    const kind = figureKind(b);
    if (!plain && kind === "mermaid") media = [fence(b.mermaid, "mermaid"), caption].filter(Boolean).join("\n\n");
    else if (!plain && kind === "frame") media = `> [interactive figure${caption && ": " + caption} — file ${b.src}, not included in Markdown]`;
    else if (!plain) media = `![${caption.replace(/[[\]]/g, "\\$&")}](${target(b.src ?? "")})`;
    const source = !plain && b.source ? `[Editable source](${target(b.source)})` : "";
    return [media, source, fold].filter(Boolean).join("\n\n");
  };

  // One rule per block type, the same on every page. `level` is the heading level of an item inside the block.
  const converters = {
    text: (b) => prose(b.text),
    callout: (b) => {
      const tone = b.tone || "info";
      const label = tone[0].toUpperCase() + tone.slice(1);
      return quote([`**${b.title ? `${label}: ${flat(prose(b.title))}` : label}**`, b.text && prose(b.text)].filter(Boolean).join("\n\n"));
    },
    list: (b) => list(b.items, b.ordered),
    stats: (b) => table(["Value", "Label"], statItems(data, b).map((i) => [i.value, i.label])),
    cards: (b, depth, level) => (b.items || []).map((i) => [
      heading(level, i.title), i.status && `*${statusLabel(i.status)}*`, i.text && prose(i.text), i.inset && quote(prose(i.inset)),
    ].filter(Boolean).join("\n\n")).join("\n\n"),
    table: (b) => table(b.columns || [], (b.rows || []).map((r) => r.map(chipText))),
    matrix: (b) => {
      const columns = (b.columns || []).map((c) => typeof c === "string" ? { name: c } : c);
      const named = (name, note) => note ? `${name} — ${note}` : name;
      const head = ["", ...columns.map((c) => named(c.name, c.note))];
      const chips = (cells) => [].concat(cells ?? []).filter((c) => c != null && c !== "" && c !== false).map(chipText).join(" / ");
      const legend = b.legend ? "Legend: " + prose([].concat(b.legend).map(chipText).join(" · ")) : "";
      const groups = (b.groups || []).map((g) => [
        g.title && `**${flat(prose(g.title))}**`,
        table(head, (g.rows || []).map((r) => [named(r.label, r.note), ...columns.map((_, n) => chips(r.cells?.[n]))])),
      ].filter(Boolean).join("\n\n"));
      return [legend, ...groups].filter(Boolean).join("\n\n");
    },
    steps: (b) => list((b.items || []).map((i) => `**${flat(i.title)}**${i.text ? ": " + i.text : ""}`), b.ordered !== false),
    details: (b, depth) => (b.items || []).map((i) => row(i, depth)).join("\n\n"),
    inset: (b, depth) => quote(blocks(b.blocks, depth + 1)),
    findings: (b, depth, level) => (b.items || []).map((i) => {
      const title = [i.id, flat(prose(i.title)), i.status && statusLabel(i.status)].filter(Boolean).join(" · ");
      const fields = (i.fields || []).map((f) => {
        const text = prose(f.text);
        return `**${flat(prose(f.label))}:**${text.includes("\n") ? "\n\n" : " "}${text}`;
      });
      const quotes = (i.quotes || []).map((q) => quote(`“${prose(q.text)}”${q.source ? ` — ${flat(prose(q.source))}` : ""}`));
      return [heading(level, title), ...fields, ...quotes].join("\n\n");
    }).join("\n\n"),
    compare: (b) => {
      const options = b.options || [];
      const name = (o) => o.name === b.recommended ? `**${o.name}**` : o.name;
      const grid = b.criteria?.length ? [table(["", ...options.map(name)], b.criteria.map((c) => [c.name, ...(c.values || []).map(chipText)]))] : [];
      const details = options.map((o) => [
        prose(name(o)) + (o.name === b.recommended ? " (recommended)" : ""),
        o.summary && prose(o.summary),
        list([...(o.pros || []).map((p) => "Pro: " + p), ...(o.cons || []).map((c) => "Con: " + c)]),
      ].filter(Boolean).join("\n\n"));
      return [...grid, ...details].join("\n\n");
    },
    decisions: (b, depth, level) => (b.items || []).map((d) => {
      const pick = picks[d.id];
      const options = (d.options || []).map((o) => o === d.recommended ? `${o} (recommended)` : o);
      return [
        heading(level, `${d.id}. ${d.title || d.question}`),
        d.description && prose(d.description),
        d.title && d.question && `**${flat(prose(d.question))}**`,
        d.context && prose(d.context),
        list(options),
        d.why && `**Why recommended:** ${prose(d.why)}`,
        d.technical && prose(d.technical),
        pick?.choice && `**Your pick:** ${prose(pick.choice)}`,
        pick?.note && `**Your note:** ${prose(pick.note)}`,
      ].filter(Boolean).join("\n\n");
    }).join("\n\n"),
    code: (b) => fence(b.text ?? ""),
    figure,
    // Each gallery item is a bullet, so its fold-out stays nested under its own figure.
    gallery: (b, depth, level) => {
      const items = (entries) => (entries || []).map((i) => bullet(figure(i, depth))).join("\n");
      if (!b.groups) return items(b.items);
      return b.groups.map((g) => [g.title && heading(level, g.title), g.note && prose(g.note), items(g.items)].filter(Boolean).join("\n\n")).join("\n\n");
    },
    html: () => plain ? "[figure]" : "> [HTML block, not included in Markdown]",
  };

  function block(b, depth) {
    const level = 3 + depth;
    const convert = converters[b.type] || (() => `> **Unknown block type: ${b.type}**`);
    const body = convert(b, depth, level + (b.heading ? 1 : 0));
    return [b.heading && heading(level, b.heading), body].filter(Boolean).join("\n\n");
  }

  const header = [data.eyebrow, data.subtitle].filter(Boolean).map((t) => flat(prose(t))).join(" · ");
  const sections = (data.sections || []).map((s) => [heading(2, s.title), s.intro && prose(s.intro), blocks(s.blocks, 0)].filter(Boolean).join("\n\n"));
  return [heading(1, data.title ?? ""), header, ...sections].filter(Boolean).join("\n\n") + "\n";
}
</script>
<!-- The Pele engine and its drop-in theme; fill.py copies them in only when a figure has `mermaid`. It runs before the
     script below, and the drop-in draws every pre.mermaid once the page has rendered. -->
<script id="pele-engine"></script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const ICONS = JSON.parse(document.getElementById("icons").textContent);
const TONES = ["ok", "bad", "warn", "info", "muted"];
const statuses = data.statuses || DEFAULT_STATUSES;
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const storageKey = "artifact:" + location.pathname + ":" + (data.title || "");
const pickedRowsKey = storageKey + ":rows";
const highlightsOffKey = storageKey + ":highlights-off";
const themeKey = "artifact:theme";

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

// Inline Markdown subset: `code`, **bold**, *em*, <u>underline</u>, [text](url), blank-line paragraphs.
// Code spans become placeholders first, so `*` or `[` inside them stays literal while links and
// underlines may still wrap them. URLs may hold one level of parentheses.
function inline(text) {
  const codes = [];
  return escapeHtml(String(text ?? "").replace(/\u0000/g, ""))
    .replace(/`([^`]+)`/g, (_, code) => `\u0000${codes.push(code) - 1}\u0000`)
    .replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, "<u>$1</u>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/(?:[^()\s]|\([^()\s]*\))+|(?:[^():\s]|\([^():\s]*\))+)\)/g, '<a href="$2">$1</a>')
    .replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[n]}</code>`);
}

// A Markdown list line: "- " or "* " for bullets, "1. " or "1) " for numbers, indented to nest.
const LIST_LINE = /^(\s*)([-*]|\d+[.)])\s+(.*)$/;

// Turns a run of list lines into the item tree listHtml draws. A deeper indent nests under the item
// above it; an indented line without a marker continues the item above it.
function parseList(lines) {
  const top = { indent: -1, items: [] };
  const levels = [top];
  for (const line of lines) {
    const match = LIST_LINE.exec(line);
    if (!match) {
      const item = levels.at(-1).items.at(-1);
      if (item) item.text += " " + line.trim();
      continue;
    }
    const [, space, marker, text] = match;
    const ordered = /\d/.test(marker), start = parseInt(marker, 10);
    while (levels.length > 1 && space.length < levels.at(-1).indent) levels.pop();
    let level = levels.at(-1);
    if (level === top && top.indent < 0) Object.assign(top, { indent: space.length, ordered, start });
    else if (space.length > level.indent && level.items.length) {
      const parent = level.items.at(-1);
      if (!parent.items) Object.assign(parent, { items: [], ordered, start });
      level = { indent: space.length, items: parent.items };
      levels.push(level);
    }
    level.items.push({ text });
  }
  return top;
}

// Blank lines split paragraphs; inside one, single line breaks stay and runs of list lines become
// lists. `tail` is markup that ends the last paragraph.
function paragraphs(text, tail = "") {
  const parts = String(text ?? "").replace(/\r\n?/g, "\n").split(/\n\s*\n/);
  return parts.map((part, i) => {
    const end = i === parts.length - 1 ? tail : "";
    const runs = [];
    for (const line of part.split("\n")) {
      // An indented line right after a list line belongs to that list.
      const list = LIST_LINE.test(line) || Boolean(runs.at(-1)?.list && /^\s+\S/.test(line));
      if (!runs.length || runs.at(-1).list !== list) runs.push({ list, lines: [] });
      runs.at(-1).lines.push(line);
    }
    return runs.map((run, n) => {
      const last = n === runs.length - 1 ? end : "";
      if (!run.list) return `<p>${inline(run.lines.join("\n")).replace(/\n/g, "<br>")}${last}</p>`;
      const list = parseList(run.lines);
      return listHtml(list.items, list.ordered, list.start) + (last ? `<p>${last}</p>` : "");
    }).join("");
  }).join("");
}

// Unknown names draw nothing, so a typo never breaks the page.
function icon(name) {
  const svg = ICONS[name]?.svg;
  return svg ? `<span class="icon" aria-hidden="true">${svg}</span>` : "";
}

// List items are strings, or { text, items, ordered } for a nested list.
// A numbered list may start at `start`, as written in Markdown text ("3. third").
function listHtml(items, ordered, start) {
  const tag = ordered ? "ol" : "ul";
  const item = (i) => typeof i === "string" ? inline(i) : inline(i.text) + (i.items?.length ? listHtml(i.items, i.ordered, i.start) : "");
  const from = ordered && start > 1 ? ` start="${start}"` : "";
  return `<${tag}${from}>${(items || []).map((i) => `<li>${item(i)}</li>`).join("")}</${tag}>`;
}

function tone(name) {
  return TONES.includes(name) ? name : "muted";
}

// A chip is { text, tone, title, icon }: `title` is hover text, shown by wireChipTips, and `icon` a key
// of the icon catalog, drawn before the text. A bare string stands for a muted chip.
function tipAttrs(title) {
  return title ? ` tabindex="0" data-tip="${escapeHtml(title)}" aria-description="${escapeHtml(title)}"` : "";
}

function chip(c) {
  const { text, tone: name, title, icon: iconName } = c !== null && typeof c === "object" ? c : { text: c };
  return `<span class="pill ${tone(name)}"${tipAttrs(title)}>${icon(iconName)}${inline(text)}</span>`;
}

// A table cell is a string, or a chip object for a status chip.
function cellText(cell) {
  return cell !== null && typeof cell === "object" ? cell.text : cell;
}

function cellHtml(cell) {
  return cell !== null && typeof cell === "object" ? chip(cell) : inline(cell);
}

// A status chip is capped in width and cut with an ellipsis; a label longer than STATUS_CHIP_MAX characters
// carries its full text as hover text.
function pill(statusKey) {
  const status = statuses[statusKey] || { label: statusKey, tone: "muted" };
  const label = String(status.label);
  return `<span class="pill status ${tone(status.tone)}"${tipAttrs(label.length > STATUS_CHIP_MAX ? label : "")}>${escapeHtml(label)}</span>`;
}

function loadState(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}

// Returns whether the state was saved; storage can be blocked.
function saveState(key, state) {
  try { localStorage.setItem(key, JSON.stringify(state)); return true; } catch { return false; }
}

// Longest status label, in characters, that is sure to fit its chip without an ellipsis.
const STATUS_CHIP_MAX = 24;
// Longest step text, in characters, that can sit in a row.
const STEP_TEXT_MAX = 80;
// Longest finding field or quote, in characters, that still fits one line beside its label.
const FIELD_LINE_MAX = 90;

const renderers = {
  text: (b) => paragraphs(b.text),
  callout: (b) => `<div class="callout ${tone(b.tone || "info")}">${b.title ? `<b>${inline(b.title)}</b>` : ""}${paragraphs(b.text)}</div>`,
  list: (b) => listHtml(b.items, b.ordered),
  stats: (b) => {
    const items = statItems(data, b);
    return `<div class="grid stats">${items.map((i) => `<div class="card stat ${tone(i.tone)}"><b>${escapeHtml(i.value)}</b><span>${inline(i.label)}</span></div>`).join("")}</div>`;
  },
  cards: (b) => `<div class="grid">${(b.items || []).map((i) => `<div class="card"><h3>${icon(i.icon)}${inline(i.title)}${i.status ? pill(i.status) : ""}</h3>${paragraphs(i.text)}${i.inset ? `<div class="inset">${paragraphs(i.inset)}</div>` : ""}</div>`).join("")}</div>`,
  table: (b) => {
    const head = (b.columns || []).map((c) => `<th>${inline(c)}</th>`).join("");
    const cells = (r) => r.map((c) => `<td>${cellHtml(c)}</td>`).join("");
    if (!b.select) return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${(b.rows || []).map((r) => `<tr>${cells(r)}</tr>`).join("")}</tbody></table></div>`;
    // Rows start ticked; the user unticks what to skip. Picks are keyed by heading and every cell.
    const picked = loadState(pickedRowsKey);
    const rows = (b.rows || []).map((r) => {
      const key = (b.heading || "") + "|" + r.map(cellText).join(" | ");
      return `<tr data-key="${escapeHtml(key)}"><td><input type="checkbox"${picked[key] ?? true ? " checked" : ""}></td>${cells(r)}</tr>`;
    }).join("");
    return `<div class="scroll"><table class="pick" data-group="${escapeHtml(b.heading || "")}"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  },
  // Rows sit in groups; every cell stacks its chips one per line, whatever the width.
  matrix: (b) => {
    const columns = (b.columns || []).map((c) => typeof c === "string" ? { name: c } : c);
    const note = (text) => text ? `<small>${inline(text)}</small>` : "";
    // A cell is a list of chips; a single chip or a string stands for a one-chip list, and blanks draw nothing.
    const cell = (chips) => `<td><div class="chips">${[].concat(chips ?? []).filter((c) => c != null && c !== "" && c !== false).map(chip).join("")}</div></td>`;
    const row = (r) => `<tr><th scope="row">${inline(r.label)}${note(r.note)}</th>${columns.map((_, n) => cell(r.cells?.[n])).join("")}</tr>`;
    const group = (g) => `<tbody>${g.title ? `<tr class="group"><th colspan="${columns.length + 1}">${inline(g.title)}</th></tr>` : ""}${(g.rows || []).map(row).join("")}</tbody>`;
    const head = columns.map((c) => `<th>${inline(c.name)}${note(c.note)}</th>`).join("");
    // The legend is a line of text, or a list of chips and text pieces that explain them.
    const legend = b.legend
      ? `<div class="legend">${[].concat(b.legend).map((i) => typeof i === "string" ? `<span>${inline(i)}</span>` : chip(i)).join("")}</div>`
      : "";
    return `${legend}<div class="scroll"><table class="matrix"><thead><tr><th></th>${head}</tr></thead>${(b.groups || []).map(group).join("")}</table></div>`;
  },
  // Ordered steps (the default) are an <ol> with each number written here, so "Show only changes" keeps it right;
  // `ordered: false` is a <ul> of parts. A block with any long text is always a rail. Shorter ones leave the
  // choice of row or rail to wireSteps, by width.
  steps: (b) => {
    const items = b.items || [];
    if (!items.length) return "";
    const ordered = b.ordered !== false;
    const list = items.map((i, n) => {
      const number = ordered ? `<span class="num" aria-hidden="true">${n + 1}</span>` : "";
      return `<li class="step">${number}<b>${icon(i.icon)}${inline(i.title)}</b><span class="txt">${inline(i.text)}</span></li>`;
    }).join("");
    if (!ordered) return `<ul class="steps parts">${list}</ul>`;
    const long = items.some((i) => String(i.text ?? "").length > STEP_TEXT_MAX);
    return `<ol class="steps${long ? " rail" : ""}">${list}</ol>`;
  },
  details: (b) => (b.items || []).map((i) => `<details${i.open ? " open" : ""}><summary>${icon(i.icon)}<span class="t">${inline(i.title)}</span>${i.preview ? `<span class="preview">${inline(i.preview)}</span>` : ""}</summary><div class="body">${i.text ? paragraphs(i.text) : ""}${(i.blocks || []).map(renderBlock).join("")}</div></details>`).join(""),
  inset: (b) => `<div class="inset">${(b.blocks || []).map((inner) => renderBlock(inner)).join("")}</div>`,
  findings: (b) => (b.items || []).map((i) => {
    // A quote is one more labelled line, named by its source. All one-liners make a label column.
    const quotes = (i.quotes || []).map((q) => ({ label: q.source || "Quote", text: q.text, quote: true }));
    const lines = [...(i.fields || []), ...quotes];
    const short = lines.every((l) => { const text = String(l.text ?? ""); return text.length <= FIELD_LINE_MAX && !/[\r\n]/.test(text); });
    const rows = lines.map((l) => `<dt>${inline(l.label)}</dt>${l.quote ? `<dd class="quote">${paragraphs(`“${l.text ?? ""}`, "”")}</dd>` : `<dd>${paragraphs(l.text)}</dd>`}`).join("");
    return `<details${i.open ? " open" : ""}><summary>${i.id ? `<span class="id">${escapeHtml(i.id)}</span>` : ""}<span class="t">${inline(i.title)}</span>${i.status ? pill(i.status) : ""}</summary><div class="body"><dl${short ? ' class="table"' : ""}>${rows}</dl></div></details>`;
  }).join(""),
  compare: (b) => {
    const cards = (b.options || []).map((o) => `<div class="card${o.name === b.recommended ? " rec" : ""}"><h3>${inline(o.name)}${o.name === b.recommended ? '<span class="pill info">Recommended</span>' : ""}</h3>${paragraphs(o.summary)}<ul>${(o.pros || []).map((p) => `<li class="pro">${inline(p)}</li>`).join("")}${(o.cons || []).map((c) => `<li class="con">${inline(c)}</li>`).join("")}</ul></div>`).join("");
    const criteria = b.criteria?.length ? renderers.table({ columns: ["", ...(b.options || []).map((o) => o.name)], rows: b.criteria.map((c) => [c.name, ...c.values]) }) : "";
    return `<div class="cmp">${cards}</div>${criteria}`;
  },
  decisions: (b) => {
    const state = loadState(storageKey);
    return (b.items || []).map((d) => {
      const picked = state[d.id]?.choice ?? d.recommended;
      // The recommended option stays softly outlined whichever option is picked; it carries no word.
      const options = (d.options || []).map((o) => `<label${o === d.recommended ? ' class="rec" title="Recommended"' : ""}><input type="radio" name="dec-${escapeHtml(d.id)}" value="${escapeHtml(o)}"${o === picked ? " checked" : ""}>${inline(o)}</label>`).join("");
      // An item with a title leads with it, then one paragraph: the description ending in the question
      // in bold. An older item leads with the question and may add `context`.
      const asked = d.title && d.question ? ` <b>${inline(d.question)}</b>` : "";
      const heading = inline(d.title || d.question);
      const description = d.description || asked ? `<div class="desc">${paragraphs(d.description, asked)}</div>` : "";
      const context = d.context ? `<div class="ctx">${inline(d.context)}</div>` : "";
      // The recommended option is already ticked, so the box gives the reason, then the mechanics in muted text.
      const reasons = (d.why ? `<p><b class="lbl">Why recommended:</b> ${inline(d.why)}</p>` : "") + (d.technical ? `<div class="tech">${paragraphs(d.technical)}</div>` : "");
      const box = reasons ? `<div class="why">${reasons}</div>` : "";
      return `<div class="decision" data-id="${escapeHtml(d.id)}"><div class="dh">${escapeHtml(d.id)}. ${heading}</div>${description}${context}${box}<div class="opts">${options}</div><textarea placeholder="Note (optional)">${escapeHtml(state[d.id]?.note || "")}</textarea></div>`;
    }).join("");
  },
  code: (b) => `<pre><code>${escapeHtml(b.text)}</code></pre>`,
  figure: (b) => {
    const src = escapeHtml(b.src);
    const label = escapeHtml(b.alt || b.caption || "");
    const kind = figureKind(b);
    // A `dark` image replaces `src` in the dark theme. Both are lazy, so the one the theme hides is not fetched.
    const dark = b.dark && kind === "image" ? escapeHtml(b.dark) : "";
    const image = (href, theme) => `<img src="${href}" alt="${label}"${theme ? ` class="${theme}-only" loading="lazy"` : ""}>`;
    let media = dark ? image(src, "light") + image(dark, "dark") : image(src);
    if (kind === "video") media = `<video src="${src}" aria-label="${label}" controls preload="metadata"></video>`;
    // HTML diagrams and mockups run in a sandbox without access to this page or its storage.
    if (kind === "frame") media = `<iframe src="${src}" title="${label}" style="height:${Number(b.height) || 420}px" loading="lazy" sandbox="allow-scripts"></iframe><button type="button" class="frame-max" data-frame-max title="Open full screen" aria-label="Open full screen">⤢</button>`;
    // Mermaid text is drawn in place by the Pele engine (see the pele-engine script); it has no file to open.
    if (kind === "mermaid") media = `<pre class="mermaid">${escapeHtml(b.mermaid)}</pre>`;
    const links = b.source ? `<a class="fig-link" href="${escapeHtml(b.source)}" target="_blank" rel="noopener">Editable source</a>` : "";
    // An optional fold-out under the caption: one closed `details` row holding `text`, then `code` as monospace lines.
    const d = b.details;
    const fold = d ? renderers.details({ items: [{ title: d.title || "Details", text: d.text, blocks: d.code ? [{ type: "code", text: d.code }] : [] }] }) : "";
    return `<figure data-kind="${kind}">${media}<figcaption>${inline(b.caption || "")}${links}</figcaption>${fold}</figure>`;
  },
  // `groups` split the items by method or experiment: a title with a divider line, an optional note,
  // then the group's own wrapping row. All of it sits in one block, which is the gallery the viewer steps through.
  gallery: (b) => {
    const row = (items) => `<div class="gallery${b.pixelated ? " pixelated" : ""}" style="--w:${Number(b.width) || 320}px">${(items || []).map((i) => renderers.figure(i)).join("")}</div>`;
    const group = (g) => `<div class="gallery-group">${g.title ? `<h4>${inline(g.title)}</h4>` : ""}${g.note ? `<p class="legend">${inline(g.note)}</p>` : ""}${row(g.items)}</div>`;
    return `<div class="gallery-block">${b.groups ? b.groups.map(group).join("") : row(b.items)}</div>`;
  },
  // Escape hatch for hand-drawn SVG or markup no block covers; content is trusted agent output.
  html: (b) => b.html || "",
};

// `headingId` is set on a section's top-level blocks, which the Contents index links to (see buildOutlines).
function renderBlock(block, headingId) {
  const render = renderers[block.type];
  const heading = block.heading ? `<h3${headingId ? ` id="${escapeHtml(headingId)}" tabindex="-1"` : ""}>${inline(block.heading)}</h3>` : "";
  return heading + (render ? render(block) : `<div class="callout bad"><b>Unknown block type: ${escapeHtml(block.type)}</b></div>`);
}

// fill.py embeds the version the user last saw as data.previous. The page compares the two and
// marks what is added or changed. Sections match by id, else title; blocks by position in their
// section; items by the chain in itemKey (id first, so an edited item stays "changed"). Matrix rows are items
// keyed by group title and label. `fields` are the block fields that hold items, which diffBlock sets
// aside when it compares the block itself; itemsOf reads the first one, except for matrix rows and
// grouped gallery items, which it lifts out of `groups`.
const ITEM_DOM = {
  list: { fields: ["items"], items: ":scope > :is(ul, ol) > li" },
  cards: { fields: ["items"], items: ":scope > .grid > .card", badge: "h3" },
  steps: { fields: ["items"], items: ":scope .step", badge: "b" },
  details: { fields: ["items"], items: ":scope > details", badge: "summary > .t" },
  findings: { fields: ["items"], items: ":scope > details", badge: "summary > .t" },
  decisions: { fields: ["items"], items: ":scope > .decision", badge: ".dh" },
  compare: { fields: ["options"], items: ":scope > .cmp > .card", badge: "h3" },
  table: { fields: ["rows"], items: ":scope tbody tr", badge: "td:not(:has(input))" },
  matrix: { fields: ["groups"], items: ":scope tbody tr:not(.group)", badge: "th" },
  gallery: { fields: ["items", "groups"], items: ":scope .gallery > figure", badge: "figcaption" },
};
const KIND_TONE = { added: "ok", changed: "warn", removed: "bad" };

function same(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function itemKey(item) {
  if (typeof item === "string") return item;
  if (Array.isArray(item)) return item.map(cellText).join(" | ");
  return String(item.id ?? item.title ?? item.name ?? item.text ?? item.src ?? item.mermaid ?? JSON.stringify(item));
}

function itemLabel(item) {
  const label = typeof item === "object" && !Array.isArray(item)
    ? [item.id, item.title ?? item.name ?? item.question].filter(Boolean).join(" ") || item.text || item.caption || item.src || item.mermaid?.trim().split("\n")[0] || "item"
    : itemKey(item);
  return label.length > 80 ? label.slice(0, 77) + "..." : label;
}

// The items a block is diffed by. Matrix rows and grouped gallery items are lifted out of their
// groups; a gallery item keeps its itemKey and notes its group, so a moved item reads as changed.
function itemsOf(block) {
  if (block.type === "matrix") return (block.groups || []).flatMap((group) => (group.rows || []).map((row) => ({ ...row, id: [group.title, row.label].filter(Boolean).join(" › ") })));
  if (block.type === "gallery" && block.groups) return block.groups.flatMap((group) => (group.items || []).map((item) => ({ ...item, group: group.title, note: group.note })));
  return block[ITEM_DOM[block.type]?.fields[0]] || [];
}

// Marks each current item "added", "changed", or null; removed items come back whole. `reordered`
// is true when the items present in both versions changed their relative order.
function diffItems(before, after) {
  const old = new Map((before || []).map((item) => [itemKey(item), item]));
  const kept = new Set();
  const marks = (after || []).map((item) => {
    const key = itemKey(item);
    kept.add(key);
    if (!old.has(key)) return "added";
    return same(old.get(key), item) ? null : "changed";
  });
  const removed = [...old].filter(([key]) => !kept.has(key)).map(([, item]) => item);
  const reordered = !same([...old.keys()].filter((key) => kept.has(key)), [...kept].filter((key) => old.has(key)));
  return { marks, removed, reordered };
}

// Added and changed items carry their own marks. The block is marked "changed" when its other
// fields changed or its items were reordered (`own`), or when items were only removed, so a
// removal still leaves a mark.
function diffBlock(before, after) {
  if (!before) return { mark: "added", own: false, marks: [], removed: [] };
  if (same(before, after)) return null;
  const fields = ITEM_DOM[after.type]?.fields;
  if (!fields || before.type !== after.type) return { mark: "changed", own: true, marks: [], removed: [] };
  const { marks, removed, reordered } = diffItems(itemsOf(before), itemsOf(after));
  const withoutItems = (block) => ({ ...block, ...Object.fromEntries(fields.map((field) => [field, 0])) });
  const own = reordered || !same(withoutItems(before), withoutItems(after));
  return { mark: own || !marks.some(Boolean) ? "changed" : null, own, marks, removed };
}

function diffSection(before, after, note) {
  const blocks = (after.blocks || []).map((block, i) => {
    const diff = diffBlock(before.blocks?.[i], block);
    if (!diff) return null;
    const heading = block.heading || `${block.type} block ${i + 1}`;
    if (diff.mark === "added") note("added", after.title, heading);
    else if (diff.own) note("changed", after.title, heading);
    const items = itemsOf(block);
    diff.marks.forEach((mark, n) => mark && note(mark, after.title, itemLabel(items[n])));
    diff.removed.forEach((item) => note("removed", after.title, itemLabel(item)));
    return diff;
  });
  const dropped = (before.blocks || []).slice(blocks.length);
  dropped.forEach((block, n) => note("removed", after.title, block.heading || `${block.type} block ${blocks.length + n + 1}`));
  // Dropped, not zeroed: same() compares JSON text, so an added key would also shift the key order.
  const ownFields = ({ blocks, collapsed, ...rest }) => rest;
  const fieldsChanged = !same(ownFields(before), ownFields(after));
  if (fieldsChanged) note("changed", after.title, "heading or intro");
  return { mark: fieldsChanged || dropped.length ? "changed" : null, blocks };
}

function diffArtifact(before, after) {
  const entries = [];
  const note = (kind, where, label) => entries.push({ kind, text: label ? `${where} › ${label}` : where });
  const headerFields = ["title", "subtitle", "eyebrow"];
  if (!same(headerFields.map((k) => before[k]), headerFields.map((k) => after[k]))) note("changed", "Header");
  const old = new Map((before.sections || []).map((s) => [s.id || s.title, s]));
  const sections = new Map();
  for (const section of after.sections || []) {
    const key = section.id || section.title;
    const prior = old.get(key);
    old.delete(key);
    if (prior) sections.set(section, diffSection(prior, section, note));
    else {
      sections.set(section, { mark: "added", blocks: [] });
      note("added", section.title);
    }
  }
  for (const gone of old.values()) note("removed", gone.title);
  return { sections, entries };
}

// With highlights off, this version renders as a new page would; the next revision marks its own changes.
const versionChanges = data.previous ? diffArtifact(data.previous, data) : null;
const changes = versionChanges && loadState(highlightsOffKey).version !== data.version ? versionChanges : null;

function badge(mark) {
  return `<span class="pill change ${KIND_TONE[mark]}">${mark}</span>`;
}

// Every block sits in a wrapper so "Show only changes" can hide the ones that did not change.
// Items get identity marks whenever items were added, changed, or removed, so the unchanged
// ones can hide even when the only item change is a removal.
function renderChangedBlock(block, diff, headingId) {
  const itemsChanged = diff?.marks.some(Boolean) || diff?.removed.length;
  const attrs = `data-type="${escapeHtml(block.type)}"${diff?.mark ? ` data-change="${diff.mark}"` : ""}${itemsChanged ? ` data-marks="${diff.marks.map((m) => m || "").join(",")}"` : ""}`;
  return `<div class="block" ${attrs}>${diff?.mark ? badge(diff.mark) : ""}${renderBlock(block, headingId)}</div>`;
}

// Items are marked after rendering, so the renderers stay unaware of versions.
function markChangedItems() {
  for (const wrapper of document.querySelectorAll(".block[data-marks]")) {
    const spec = ITEM_DOM[wrapper.dataset.type];
    const marks = wrapper.dataset.marks.split(",");
    wrapper.querySelectorAll(spec.items).forEach((element, n) => {
      element.dataset.item = "";
      if (!marks[n]) return;
      element.dataset.change = marks[n];
      const fold = element.matches("details") ? element : element.querySelector(":scope > details");
      if (fold) fold.open = true;
      (spec.badge ? element.querySelector(spec.badge) : element)?.insertAdjacentHTML("beforeend", badge(marks[n]));
    });
  }
}

// The change toggles sit in one row above the change list. With highlights off only "Highlight changes" stays,
// in the same place, so the reader can turn them back on.
function renderChanges() {
  if (!versionChanges) return "";
  const since = "v" + (data.version - 1);
  if (!versionChanges.entries.length) return `<div class="callout muted"><b>No changes since ${since}</b></div>`;
  const highlight = `<label class="toggle-changes"><input type="checkbox" data-highlights${changes ? " checked" : ""}> Highlight changes</label>`;
  if (!changes) return `<div class="change-tools">${highlight}</div>`;
  const counts = Object.keys(KIND_TONE)
    .map((kind) => [kind, changes.entries.filter((e) => e.kind === kind).length])
    .filter(([, count]) => count)
    .map(([kind, count]) => `${count} ${kind}`).join(" · ");
  const rows = changes.entries.map((e) => `<li><span class="pill ${KIND_TONE[e.kind]}">${e.kind}</span> ${inline(e.text)}</li>`).join("");
  const only = data.layout === "slides" ? "" : '<label class="toggle-changes"><input type="checkbox" data-only-changes> Show only changes</label>';
  return `<div class="change-tools">${highlight}${only}</div><details class="callout info changes" open><summary><span class="t">Changed since ${since}: ${counts}</span></summary><ul>${rows}</ul></details>`;
}

// Each section's anchor and sub-sections: the top-level blocks that have a heading. A sub-section's id joins the
// section's id and its position among the headed blocks. Every id is unique on the page: an author's id wins over a
// generated one ("s2", "plan--1"), the first section with an id keeps it, and any id that repeats or names a page-shell
// element gets a "-2", "-3" suffix that skips every id an author wrote.
const SHELL_IDS = ["data", "icons", "root", "bar", "toc", "pt-list", "markdown-converter", "pele-engine", "viewer", "viewer-stage"];
function buildOutlines(sections) {
  const used = new Set(SHELL_IDS);
  const written = new Set(sections.map((section) => section.id).filter(Boolean));
  const unique = (wanted) => {
    let id = wanted, n = 2;
    while (used.has(id) || (id !== wanted && written.has(id))) id = `${wanted}-${n++}`;
    used.add(id);
    return id;
  };
  const authored = sections.map((section) => section.id ? unique(section.id) : null);
  return sections.map((section, i) => {
    const id = authored[i] ?? unique("s" + (i + 1));
    const subs = (section.blocks || []).flatMap((block, at) => block.heading ? [{ at, title: block.heading }] : [])
      .map((sub, n) => ({ ...sub, id: unique(`${id}--${n + 1}`) }));
    return { id, subs };
  });
}
const outlines = buildOutlines(data.sections || []);

function renderSection(section, index) {
  const { id, subs } = outlines[index];
  const headingIds = new Map(subs.map((sub) => [sub.at, sub.id]));
  const diff = changes?.sections.get(section);
  const blocks = (section.blocks || []).map((block, i) => ({ type: block.type, side: block.side, html: renderChangedBlock(block, diff?.blocks[i], headingIds.get(i)) }));
  // "split" puts figures and blocks marked `side` on the right and every other block on the left.
  const right = (b) => b.type === "figure" || b.side;
  const body = section.layout === "split"
    ? `<div class="split"><div>${blocks.filter((b) => !right(b)).map((b) => b.html).join("")}</div><div>${blocks.filter(right).map((b) => b.html).join("")}</div></div>`
    : blocks.map((b) => b.html).join("");
  const heading = `<h2>${inline(section.title)}${diff?.mark ? badge(diff.mark) : ""}</h2>`;
  const content = (section.intro ? `<p class="intro">${inline(section.intro)}</p>` : "") + body;
  // Outside a deck every section folds on its heading. `collapsed` starts it folded, unless something
  // in it changed since the version the reader saw.
  const changed = diff?.mark || diff?.blocks.some(Boolean);
  const inner = data.layout === "slides" ? heading + content
    : `<details class="sec"${section.collapsed && !changed ? "" : " open"}><summary>${heading}</summary>${content}</details>`;
  return `<section id="${escapeHtml(id)}" tabindex="-1" class="slide"${diff?.mark ? ` data-change="${diff.mark}"` : ""}>${inner}</section>`;
}

// wireExports gives the export buttons their actions.
const EXPORT_TOOLS = `<div class="exports">
<button type="button" data-export="pdf" title="Print this page or save it as a PDF, in the light theme with every section, row and graph open">Export PDF</button>
<button type="button" data-export="markdown" title="Download the whole page as a Markdown file, with image and graph paths as the page uses them">Export Markdown</button>
<button type="button" data-export="zip" title="Download a zip with the Markdown file, every file the page shows and the page's data.json">Export zip</button>
<button type="button" data-export="copy" title="Copy the page as plain Markdown, without file paths or HTML">Copy Markdown</button></div>`;

function renderHeader() {
  const version = data.version > 1 ? `<span class="pill muted">v${data.version}</span>` : "";
  const eyebrow = data.eyebrow || version ? `<div class="eyebrow">${inline(data.eyebrow || "")} ${version}</div>` : "";
  return `<header class="slide">${eyebrow}<h1>${inline(data.title)}</h1>${data.subtitle ? `<p class="sub">${inline(data.subtitle)}</p>` : ""}${renderChanges()}</header>`;
}

// The sticky bar, first in the body. The Contents toggle joins it at the left (see wireContents).
function renderBar() {
  // Sections fold outside a deck; one section has nothing to fold against.
  const folds = data.layout === "slides" || (data.sections || []).length < 2 ? "" :
    '<div class="folds"><button type="button" data-fold="shut">Collapse all</button><button type="button" data-fold="open">Expand all</button></div>';
  return `<div class="bar" id="bar"><div class="bar-row">${folds}${EXPORT_TOOLS}</div><span class="pill export-status" role="status" hidden></span></div>`;
}

// Saves every decision and ticked row, and returns them as the text the user pastes back.
function collectDecisions() {
  const decisions = {};
  const lines = [];
  for (const row of document.querySelectorAll(".decision")) {
    const choice = row.querySelector("input:checked")?.value || "";
    const note = row.querySelector("textarea").value.trim();
    decisions[row.dataset.id] = { choice, note };
    lines.push(`${row.dataset.id}: ${choice || "(no choice)"}${note ? ` - ${note}` : ""}`);
  }
  saveState(storageKey, decisions);
  const pickedRows = {};
  for (const table of document.querySelectorAll("table.pick")) {
    const group = table.dataset.group || table.closest("section").querySelector("h2").textContent;
    lines.push("", group + ":");
    for (const row of table.tBodies[0].rows) {
      const ticked = row.querySelector("input").checked;
      pickedRows[row.dataset.key] = ticked;
      const label = [...row.cells].slice(1).map((c) => c.textContent).join(" | ");
      lines.push(`[${ticked ? "x" : " "}] ${label}`);
    }
  }
  saveState(pickedRowsKey, pickedRows);
  return lines.join("\n");
}

// navigator.clipboard exists only on HTTPS and localhost; a page opened by LAN IP needs execCommand.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* fall back below */ }
  const area = document.createElement("textarea");
  area.value = text;
  area.style.cssText = "position:fixed;opacity:0";
  const focused = document.activeElement;
  document.body.append(area);
  area.select();
  try { return document.execCommand("copy"); } catch { return false; } finally {
    area.remove();
    focused?.focus({ preventScroll: true });
  }
}

function showCopyResult(bar, text, copied) {
  const toneClass = copied ? "ok" : "bad";
  const status = bar.querySelector(".copy-status");
  const output = bar.querySelector(".copy-text");
  bar.querySelector("button").className = toneClass;
  status.className = "copy-status pill " + toneClass;
  status.textContent = copied ? "Copied" : "Not copied: select the text below and copy it";
  status.hidden = false;
  output.className = "copy-text " + toneClass;
  output.textContent = text;
  output.hidden = false;
}

// Export buttons. The Markdown comes from pageToMarkdown (the converter script), the same text fill.py --markdown writes.
const FRAME_LOAD_MS = 15000; // longest wait for one frame to load
const FILE_FETCH_MS = 15000; // longest wait for one file of the zip
const FRAME_REDRAW_MS = 300; // a frame scrolled into view needs about this long to redraw its canvas
const GRAPH_SETTLE_MS = 1500; // final wait for every graph to settle
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// What to put back after printing. Printing opens every row and loads every frame; Export PDF adds the
// light theme and the paper-width layout. Ctrl+P and the button both come through openForPrint, and the
// undo steps run once, on afterprint.
const undoPrint = [];

function openForPrint() {
  closeViewer(); // a moved figure would print an empty spot, and print shows no viewer
  const shut = [...document.querySelectorAll("details:not([open])")];
  shut.forEach((d) => { d.open = true; });
  if (shut.length) undoPrint.push(() => shut.forEach((d) => { d.open = false; }));
  // The in-page contents prints whole, whatever the reader folded.
  const folded = [...document.querySelectorAll(".pagetoc [hidden]")];
  folded.forEach((el) => { el.hidden = false; });
  if (folded.length) undoPrint.push(() => folded.forEach((el) => { el.hidden = true; }));
  document.querySelectorAll('iframe[loading="lazy"]').forEach((f) => { f.loading = "eager"; });
  // Diagrams in rows just opened, or laid out for another width, are drawn again for the width they print at.
  window.peleEmbed?.refreshAll();
}

function restoreAfterPrint() {
  undoPrint.splice(0).reverse().forEach((undo) => undo());
}

// A frame that already loaded does not fire `load` again, so it is reloaded by assigning its address.
function reloadFrame(frame) {
  return new Promise((resolve) => {
    const timer = setTimeout(resolve, FRAME_LOAD_MS);
    frame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, { once: true });
    frame.src = frame.src;
  });
}

// Chrome does not wait for a frame that starts loading in beforeprint, and a canvas graph prints blank unless the
// page is laid out at the paper width first and its frame is in view while it redraws. So prepare, then print.
async function exportPdf() {
  const html = document.documentElement;
  const theme = html.dataset.theme, scroll = [scrollX, scrollY];
  let restored = false; // Ctrl+P during the wait prints and restores the page first; this export then stops
  undoPrint.push(() => {
    restored = true;
    if (theme === undefined) delete html.dataset.theme; else html.dataset.theme = theme;
    themeFrames(currentTheme());
    html.classList.remove("print-layout");
    scrollTo(...scroll);
  });
  try {
    html.dataset.theme = "light";
    themeFrames("light");
    openForPrint();
    html.classList.add("print-layout");
    window.peleEmbed?.refreshAll();
    const frames = [...document.querySelectorAll("iframe")];
    await Promise.all(frames.map(reloadFrame));
    for (const frame of frames) {
      if (restored) return;
      frame.scrollIntoView({ block: "center" });
      await sleep(FRAME_REDRAW_MS);
    }
    await sleep(GRAPH_SETTLE_MS);
  } catch (error) {
    restoreAfterPrint();
    throw error;
  }
  if (!restored) window.print();
}

const markdownOf = (plain) => pageToMarkdown(data, { plain, picks: loadState(storageKey) });

// Lowercase ASCII words joined by "-".
function fileSlug() {
  return String(data.title || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "page";
}

function download(name, blob) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
}

// The figures and gallery items of some blocks, however deeply nested.
function figuresIn(blocks) {
  return (blocks || []).flatMap((b) => {
    if (b.type === "figure") return [b];
    if (b.type === "gallery") return [...(b.items || []), ...(b.groups || []).flatMap((g) => g.items || [])];
    if (b.type === "details") return (b.items || []).flatMap((i) => figuresIn(i.blocks));
    if (b.type === "inset") return figuresIn(b.blocks);
    return [];
  });
}

// Files the page shows, as paths relative to it: each figure's `src` (not a Mermaid figure's), `dark` (only an image's)
// and `source`, without a query or hash. Absolute addresses and data: URIs are not files of the page.
function referencedFiles() {
  const figures = (data.sections || []).flatMap((s) => figuresIn(s.blocks));
  const shown = (f) => {
    const kind = figureKind(f);
    return [kind !== "mermaid" && f.src, kind === "image" && f.dark, f.source];
  };
  const paths = figures.flatMap(shown).filter((p) => typeof p === "string").map((p) => p.split(/[?#]/)[0]);
  return [...new Set(paths.filter((p) => p && !/^([a-z][a-z0-9+.-]*:|\/)/i.test(p)))];
}

const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});

function crc32(bytes) {
  let c = 0xffffffff;
  for (const byte of bytes) c = CRC_TABLE[(c ^ byte) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// Little-endian bytes for a zip record: `sizes` are the byte widths (2 or 4) of `values`, in order.
function zipRecord(sizes, values) {
  const view = new DataView(new ArrayBuffer(sizes.reduce((sum, size) => sum + size, 0)));
  let at = 0;
  sizes.forEach((size, n) => {
    if (size === 4) view.setUint32(at, values[n], true); else view.setUint16(at, values[n], true);
    at += size;
  });
  return new Uint8Array(view.buffer);
}

const ZIP_LOCAL = [4, 2, 2, 2, 2, 2, 4, 4, 4, 2, 2];
const ZIP_CENTRAL = [4, 2, 2, 2, 2, 2, 2, 4, 4, 4, 2, 2, 2, 2, 2, 4, 4];
const ZIP_END = [4, 2, 2, 2, 2, 4, 4, 2];
const ZIP_UTF8 = 0x0800; // entry names are UTF-8
const ZIP_DATE = 0x0021; // 1980-01-01, the DOS date origin, so a zip of the same files is the same bytes

// A zip of stored (uncompressed) entries: [{ name, bytes }] in, a Blob out.
function makeZip(entries) {
  const encoder = new TextEncoder();
  const body = [], directory = [];
  let offset = 0;
  for (const { name, bytes } of entries) {
    const label = encoder.encode(name), crc = crc32(bytes), size = bytes.length;
    const local = zipRecord(ZIP_LOCAL, [0x04034b50, 20, ZIP_UTF8, 0, 0, ZIP_DATE, crc, size, size, label.length, 0]);
    directory.push(zipRecord(ZIP_CENTRAL, [0x02014b50, 20, 20, ZIP_UTF8, 0, 0, ZIP_DATE, crc, size, size, label.length, 0, 0, 0, 0, 0, offset]), label);
    body.push(local, label, bytes);
    offset += local.length + label.length + size;
  }
  const directorySize = directory.reduce((sum, part) => sum + part.length, 0);
  const end = zipRecord(ZIP_END, [0x06054b50, 0, 0, entries.length, entries.length, directorySize, offset, 0]);
  return new Blob([...body, ...directory, end], { type: "application/zip" });
}

// Returns how many referenced files could not be added.
async function exportZip() {
  const encoder = new TextEncoder();
  const name = fileSlug();
  const content = Object.fromEntries(Object.entries(data).filter(([key]) => key !== "version" && key !== "previous"));
  const fetchFile = async (path) => {
    try {
      // Resolved the way the browser does, so "..", "%2e%2e" and "\" cannot leave the page's folder.
      const url = new URL(path, location.href);
      if (path.includes("\\") || !url.href.startsWith(new URL(".", location.href).href)) throw new Error("outside the page folder");
      const response = await fetch(url, { signal: AbortSignal.timeout(FILE_FETCH_MS) });
      if (!response.ok) throw new Error(String(response.status));
      return { name: path, bytes: new Uint8Array(await response.arrayBuffer()) };
    } catch { return null; }
  };
  const files = await Promise.all(referencedFiles().map(fetchFile));
  const entries = [
    { name: name + ".md", bytes: encoder.encode(markdownOf(false)) },
    { name: "data.json", bytes: encoder.encode(JSON.stringify(content, null, 2) + "\n") },
    ...files.filter(Boolean),
  ];
  download(name + ".zip", makeZip(entries));
  return files.filter((file) => !file).length;
}

function wireExports() {
  const status = document.querySelector(".export-status");
  const say = (text, toneName) => {
    status.textContent = text;
    status.className = "pill export-status " + toneName;
    status.hidden = !text;
  };
  // A busy button keeps its width, blocks a second click, and says what it is doing.
  const busy = async (button, label, work) => {
    const text = button.textContent;
    button.style.minWidth = button.offsetWidth + "px";
    button.textContent = label;
    button.disabled = true;
    try { return await work(); } finally {
      button.textContent = text;
      button.disabled = false;
      button.style.minWidth = "";
    }
  };
  const actions = {
    pdf: (button) => busy(button, "Preparing…", exportPdf),
    markdown: async () => download(fileSlug() + ".md", new Blob([markdownOf(false)], { type: "text/markdown" })),
    zip: async (button) => {
      const missing = await busy(button, "Zipping…", exportZip);
      if (missing) say(`${missing} file${missing === 1 ? "" : "s"} missing from the zip`, "warn");
    },
    copy: async () => {
      const copied = await copyText(markdownOf(true));
      say(copied ? "Copied" : "Not copied: this browser blocked it", copied ? "ok" : "bad");
    },
  };
  document.addEventListener("click", (e) => {
    const button = e.target.closest("[data-export]");
    if (!button) return;
    say("", "");
    Promise.resolve(actions[button.dataset.export](button)).catch((error) => say("Export failed: " + error.message, "bad"));
  });
}

function wireDecisions() {
  const isPick = (target) => target.closest(".decision, table.pick");
  document.addEventListener("change", (e) => { if (isPick(e.target)) collectDecisions(); });
  document.addEventListener("input", (e) => { if (isPick(e.target)) collectDecisions(); });
  document.addEventListener("click", async (e) => {
    const row = e.target.closest("table.pick tbody tr");
    // Dragging to select text in a row must not flip its tick.
    if (row && !e.target.closest("input, a, [data-tip]") && !getSelection().toString()) {
      row.querySelector("input").click();
      return;
    }
    if (!e.target.matches("[data-copy-decisions]")) return;
    const text = `Decisions for "${data.title}":\n` + collectDecisions();
    showCopyResult(e.target.closest(".copy-bar"), text, await copyText(text));
  });
}

// Chip hover text, in one shared tooltip instead of the native one, which shows late, never on touch,
// and not at all in some embedded browsers. It shows on mouse hover, keyboard focus, or a tap, and
// hides on leave, blur, Escape, or a tap elsewhere. Fixed on the body, so a scrolling table never
// clips it; it sits below the chip, or above when there is no room, and stays inside the viewport.
function wireChipTips() {
  const tip = document.createElement("div");
  tip.className = "chip-tip";
  tip.setAttribute("role", "tooltip");
  tip.hidden = true;
  document.body.append(tip);
  let owner = null;
  const place = () => {
    tip.style.left = tip.style.top = "0px"; // measure at full width, not squeezed by the last position
    const r = owner.getBoundingClientRect(), gap = 6, edge = 8;
    if (!owner.contains(document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2))) return hide();
    const { clientWidth: width, clientHeight: height } = document.documentElement; // the viewport without scrollbars
    const fitsBelow = r.bottom + gap + tip.offsetHeight <= height - edge;
    tip.style.top = `${fitsBelow ? r.bottom + gap : Math.max(edge, r.top - gap - tip.offsetHeight)}px`;
    tip.style.left = `${Math.max(edge, Math.min(r.left, width - edge - tip.offsetWidth))}px`;
  };
  const show = (chip) => {
    owner = chip;
    tip.textContent = chip.dataset.tip;
    tip.hidden = false;
    place();
  };
  const hide = () => { owner = null; tip.hidden = true; };
  const chipOf = (e) => e.target.closest?.("[data-tip]");
  document.addEventListener("pointerover", (e) => { if (e.pointerType === "mouse" && chipOf(e)) show(chipOf(e)); });
  document.addEventListener("pointerout", (e) => { if (e.pointerType === "mouse" && owner && chipOf(e) === owner && !owner.contains(e.relatedTarget)) hide(); });
  document.addEventListener("focusin", (e) => { if (chipOf(e)) show(chipOf(e)); });
  document.addEventListener("focusout", (e) => { if (owner && chipOf(e) === owner) hide(); });
  // A chip inside a row's summary shows its text without folding or unfolding the row.
  document.addEventListener("click", (e) => { if (chipOf(e)) { e.preventDefault(); show(chipOf(e)); } else hide(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  for (const type of ["scroll", "resize"]) addEventListener(type, () => { if (owner) place(); }, true);
}

// Steps blocks follow their own width, not the window's, so a side column and a phone behave alike. A short
// ordered block is a row while each step gets 10em, else a rail; a parts block puts its titles in a column from
// 40em. Hidden slides and folded sections measure 0 and fire again when shown.
function wireSteps() {
  const observer = new ResizeObserver((entries) => {
    for (const { target, borderBoxSize } of entries) {
      const width = borderBoxSize[0].inlineSize;
      const em = parseFloat(getComputedStyle(target).fontSize);
      if (target.matches(".parts")) target.classList.toggle("cols", width >= 40 * em);
      else target.classList.toggle("rail", width < target.children.length * 10 * em);
    }
  });
  // A block with long text is already a rail and stays one, so it is not observed.
  document.querySelectorAll(".steps:not(.rail)").forEach((block) => observer.observe(block));
}

// The Contents index: a control at the top left opens a side index of the sections and their block headings
// (see buildOutlines). A new visit starts closed; an open index is remembered for this page in this tab, so a refresh
// keeps it. Its folds are buttons, not <details>, so they never count as the reader's changes in readerIsBusy.
const TOC_READ_LINE = 24; // px under the bar: the last heading above this line is the one being read
function wireContents() {
  if (data.layout === "slides" || (data.sections || []).length < 3) return;
  const openKey = storageKey + ":toc-open";
  const narrow = matchMedia("(max-width: 899px)");
  const sectionEls = [...document.querySelectorAll("#root > section")]; // by position, so no id can hijack the lookup
  // An index entry is plain text: a Markdown link in a title would nest an <a> in the entry's own link.
  const label = (text) => inline(String(text ?? "").replace(/\[([^\]]+)\]\((?:[^()\s]|\([^()\s]*\))+\)/g, "$1"));
  // "Show only changes" hides entries the same way it hides their sections and blocks.
  const unchanged = (sectionEl, el = sectionEl) =>
    !changes || sectionEl.dataset.change === "added" || el.matches("[data-change]") || el.querySelector("[data-change]") ? "" : " data-unchanged";
  const subItems = (subs, n, sectionEl) => subs.map((sub, j) => {
    const block = sectionEl.querySelector(`[id="${CSS.escape(sub.id)}"]`).closest(".block");
    return `<li${unchanged(sectionEl, block)}><a href="#${escapeHtml(sub.id)}"><span class="n">${n}.${j + 1}</span><span>${label(sub.title)}</span></a></li>`;
  }).join("");
  // One outline, two views: `tail` is what the in-page list adds after a section's link (leader and reading time).
  const listOf = (tail = () => "") => outlines.map(({ id, subs }, i) => {
    const fold = subs.length
      ? `<button class="tw" type="button" aria-expanded="false" aria-label="Sub-sections of ${escapeHtml(data.sections[i].title)}"></button>`
      : '<span class="tw"></span>'; // a spacer, so titles line up
    const link = `<a href="#${escapeHtml(id)}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${label(data.sections[i].title)}</span></a>`;
    const sectionEl = sectionEls[i];
    return `<li${unchanged(sectionEl)}><div class="row">${fold}${link}${tail(i)}</div>${subs.length ? `<ol class="subs" hidden>${subItems(subs, i + 1, sectionEl)}</ol>` : ""}</li>`;
  }).join("");
  const list = listOf();
  const bar = document.getElementById("bar");
  bar.querySelector(".bar-row").insertAdjacentHTML("afterbegin", `<button class="toc-btn" type="button" aria-expanded="false" aria-controls="toc">${icon("list")}Contents</button>`);
  bar.insertAdjacentHTML("afterend", `<nav class="toc" id="toc" aria-label="Contents"><div class="toc-list"><ol>${list}</ol></div></nav><div class="toc-scrim"></div>`);
  const root = document.documentElement;
  const button = document.querySelector(".toc-btn"), toc = document.getElementById("toc");
  const scroller = toc.querySelector(".toc-list");
  const minutes = (i) => Math.max(1, Math.round(sectionEls[i].textContent.trim().split(/\s+/).length / 200));
  const reading = (i) => `<span class="lead"></span><span class="min">${minutes(i)} min</span>`;
  const pageToc = `<nav class="pagetoc" aria-label="Page contents"><button class="pt-head" type="button" aria-expanded="true" aria-controls="pt-list">Contents</button><div class="pt-list" id="pt-list"><ol>${listOf(reading)}</ol></div></nav>`;
  (document.querySelector("header .sub") ?? document.querySelector("header h1")).insertAdjacentHTML("afterend", pageToc);
  const isOpen = () => root.classList.contains("toc-open");

  // Scroll-spy: the section in view gets the highlighted row and opens its sub-sections; the one being read
  // inside it gets the guide line. Only the index's own list scrolls to keep that row visible, never the page.
  const secItems = [...scroller.querySelectorAll(":scope > ol > li")];
  const spy = outlines.map(({ id, subs }, i) => {
    const subItemsOf = secItems[i].querySelectorAll(":scope > .subs > li");
    return { li: secItems[i], el: sectionEls[i], subs: subs.map((sub, j) => ({ li: subItemsOf[j], el: sectionEls[i].querySelector(`[id="${CSS.escape(sub.id)}"]`) })) };
  });
  const setSubs = (li, open) => {
    li.querySelector(":scope > .subs").hidden = !open;
    li.querySelector(".tw").setAttribute("aria-expanded", String(open));
  };
  const shown = (el) => el.getClientRects().length > 0; // a folded section or a hidden block has no box
  let current = null, currentSub = null, queued = false;
  // A page that cannot scroll far enough never brings the last headings to the line, so a link the reader clicks
  // stays highlighted while its heading is on screen. The first mark after the jump records where the page
  // stopped; any other scroll position, or the heading leaving the window, hands control back to the spy.
  let pin = null;
  const mark = (force) => {
    if (!isOpen()) return;
    if (pin) {
      const top = pin.target.el.getBoundingClientRect().top;
      if (pin.y === null) pin.y = scrollY;
      if (scrollY !== pin.y || !shown(pin.target.el) || top < 0 || top >= innerHeight) pin = null;
    }
    const atEnd = scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 2; // a page that fits the window is at its top
    const line = bar.offsetHeight + TOC_READ_LINE;
    const reached = (el) => atEnd || el.getBoundingClientRect().top <= line;
    const inView = spy.filter((s) => shown(s.el));
    // The reached heading nearest the line; a split section lists its blocks out of page order.
    const sec = pin?.sec ?? inView.filter((s) => reached(s.el)).at(-1) ?? inView[0] ?? null;
    const sub = pin ? pin.sub : (sec?.subs ?? []).filter((s) => shown(s.el) && reached(s.el))
      .reduce((best, s) => !best || s.el.getBoundingClientRect().top > best.el.getBoundingClientRect().top ? s : best, null);
    if (sec === current && sub === currentSub && !force) return;
    if (sec !== current) {
      // Moving on shuts what the index opened by itself; a section the reader opened stays open.
      if (current?.li.dataset.auto) { setSubs(current.li, false); delete current.li.dataset.auto; }
      if (sec?.subs.length && sec.li.querySelector(":scope > .subs").hidden) { setSubs(sec.li, true); sec.li.dataset.auto = "1"; }
    }
    current?.li.classList.remove("on");
    currentSub?.li.classList.remove("on");
    sec?.li.classList.add("on");
    sub?.li.classList.add("on");
    current = sec;
    currentSub = sub;
    // A sub-section the reader folded away has no row to show; its section's row stands in.
    const row = sub && !sub.li.closest(".subs").hidden ? sub.li : sec?.li.querySelector(":scope > .row");
    if (!row) return;
    const at = row.getBoundingClientRect(), box = scroller.getBoundingClientRect();
    if (at.top < box.top) scroller.scrollTop += at.top - box.top - 8;
    else if (at.bottom > box.bottom) scroller.scrollTop += at.bottom - box.bottom + 8;
  };
  const schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; mark(); });
  };

  const setOpen = (open) => {
    root.classList.toggle("toc-open", open);
    button.setAttribute("aria-expanded", String(open));
    try { sessionStorage.setItem(openKey, open ? "1" : "0"); } catch { /* storage blocked */ }
    mark(true);
  };
  button.addEventListener("click", () => setOpen(!isOpen()));
  const toggleSubs = (fold) => {
    const li = fold.closest("li");
    setSubs(li, fold.getAttribute("aria-expanded") !== "true");
    delete li.dataset.auto; // now the reader's choice
  };
  document.querySelector(".pagetoc").addEventListener("click", (e) => {
    const fold = e.target.closest("button.tw");
    if (fold) return toggleSubs(fold);
    const head = e.target.closest(".pt-head");
    if (!head) return;
    const open = head.getAttribute("aria-expanded") !== "true";
    head.setAttribute("aria-expanded", String(open));
    document.getElementById("pt-list").hidden = !open;
  });
  scroller.addEventListener("click", (e) => {
    const fold = e.target.closest("button.tw");
    if (fold) return toggleSubs(fold);
    const id = e.target.closest("a")?.getAttribute("href").slice(1);
    const sec = spy.find((s) => s.el.id === id || s.subs.some((sub) => sub.el.id === id));
    if (!sec) return;
    const sub = sec.subs.find((s) => s.el.id === id) ?? null;
    pin = { y: null, sec, sub, target: sub ?? sec };
    schedule();
  });
  // A narrow window shows the index as a drawer: a jump from it, a tap on the scrim, or Escape closes it. The jump
  // moves focus to the heading (tabindex -1), so it does not fall to the body when the link disappears.
  document.addEventListener("click", (e) => {
    if (!isOpen() || !narrow.matches) return;
    if (e.target.closest(".toc a") || !e.target.closest(".toc, .toc-btn")) setOpen(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !isOpen() || !narrow.matches) return;
    setOpen(false);
    button.focus({ preventScroll: true });
  });
  for (const type of ["scroll", "resize", "load"]) addEventListener(type, schedule, { passive: true });
  document.addEventListener("toggle", schedule, true); // a section folded or unfolded changes what is in view
  document.addEventListener("change", schedule); // so does "Show only changes"
  let wasOpen = false;
  try { wasOpen = sessionStorage.getItem(openKey) === "1"; } catch { /* storage blocked */ }
  setOpen(wasOpen);
}

// A frame's address with the page's theme in `?theme=`, so a graph can follow the page. Other query parameters and
// the hash stay; a frame that ignores the parameter is unaffected.
function withTheme(src, theme) {
  const [, path, query = "", hash = ""] = String(src).match(/^([^?#]*)(?:\?([^#]*))?(#.*)?$/);
  const params = new URLSearchParams(query);
  params.set("theme", theme);
  return `${path}?${params}${hash}`;
}

// Only the renderer's own frames; a frame in an `html` block is the author's.
function themeFrames(theme) {
  for (const frame of document.querySelectorAll('figure[data-kind="frame"] > iframe[src]')) {
    const src = withTheme(frame.getAttribute("src"), theme);
    if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
  }
}

function currentTheme() {
  return document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light");
}

// The viewer: a click on a figure's media, or on a plot's maximize button, opens the page's own lightbox with zoom,
// pan and the gallery the figure came from. Native <dialog>, no library.
const VIEWER_MEDIA = 'figure[data-kind="image"] > img, figure[data-kind="mermaid"] > pre.mermaid > svg, .block[data-type="html"] > svg';
const VIEWER_OPENERS = `${VIEWER_MEDIA}, [data-frame-max]`;
const VIEWER_ITEMS = `${VIEWER_MEDIA}, figure[data-kind="frame"] > iframe`;
const ZOOM_MAX = 20;

const viewerDialog = document.getElementById("viewer");
const viewerStage = document.getElementById("viewer-stage");
const viewer = { items: [], index: 0, opener: null, pair: null, media: null, scale: 1, tx: 0, ty: 0 };
const viewerPointers = new Map();
let viewerPinch = null;
let viewerBackdrop = false;

// The element a click opens: the media itself, or the frame a maximize button sits over.
function viewerTarget(opener) {
  const button = opener.closest("[data-frame-max]");
  return button ? button.closest("figure").querySelector(":scope > iframe") : opener;
}

// A dark pair shows the twin the page's theme wears; both are already in the page, so a switch loads nothing.
function viewerPair(item) {
  const figure = item.parentElement;
  if (item.tagName !== "IMG" || !figure?.matches("figure")) return null;
  const light = figure.querySelector(":scope > img.light-only");
  const dark = figure.querySelector(":scope > img.dark-only");
  return light && dark ? { light, dark } : null;
}

function viewerThemed(item) {
  if (!viewer.pair) return item;
  return currentTheme() === "dark" ? viewer.pair.dark : viewer.pair.light;
}

// The stage holds the page's own element, so a GIF keeps animating and a diagram keeps its colours. A plot gets a
// fresh frame that reloads with the theme the viewer opened in, and keeps its own interaction.
function mountViewerMedia(element) {
  viewer.media = { element, parent: element.parentNode, next: element.nextSibling, copy: null };
  if (element.tagName === "IFRAME") {
    const copy = document.createElement("iframe");
    copy.src = withTheme(element.getAttribute("src"), currentTheme());
    copy.title = element.title;
    copy.setAttribute("sandbox", "allow-scripts");
    viewer.media.copy = copy;
    viewerStage.append(copy);
  } else {
    viewerStage.append(element);
  }
}

function unmountViewerMedia() {
  const media = viewer.media;
  viewer.media = null;
  if (!media) return;
  media.element.style.transform = "";
  if (!media.copy && media.parent) media.parent.insertBefore(media.element, media.next);
  viewerStage.replaceChildren();
  viewerStage.classList.remove("zoomed");
}

function applyViewerTransform() {
  const media = viewer.media;
  if (!media || media.copy) return;
  const moved = viewer.scale !== 1 || viewer.tx || viewer.ty;
  media.element.style.transform = moved ? `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})` : "";
  viewerStage.classList.toggle("zoomed", viewer.scale > 1);
}

// The media never leaves the stage: a zoomed edge stops at the viewport edge.
function clampViewerPan() {
  if (!viewer.media || viewer.media.copy || viewer.scale <= 1) { viewer.tx = 0; viewer.ty = 0; return; }
  const box = viewerStage.getBoundingClientRect();
  const drawn = viewer.media.element.getBoundingClientRect();
  const room = (side, view) => Math.max(0, (side - view) / 2);
  viewer.tx = Math.max(-room(drawn.width, box.width), Math.min(room(drawn.width, box.width), viewer.tx));
  viewer.ty = Math.max(-room(drawn.height, box.height), Math.min(room(drawn.height, box.height), viewer.ty));
}

// Zoom keeps the point under the cursor, or between two fingers, still; x and y are measured from the stage middle.
function zoomViewer(next, x = 0, y = 0) {
  if (!viewer.media || viewer.media.copy) return;
  const scale = Math.min(ZOOM_MAX, Math.max(1, next));
  if (scale === viewer.scale) return;
  const ratio = scale / viewer.scale;
  viewer.tx = x - ratio * (x - viewer.tx);
  viewer.ty = y - ratio * (y - viewer.ty);
  viewer.scale = scale;
  // Clamping reads the drawn box, so the new scale has to be on the element before it runs.
  applyViewerTransform();
  clampViewerPan();
  applyViewerTransform();
}

function resetViewerZoom() {
  viewer.scale = 1;
  viewer.tx = 0;
  viewer.ty = 0;
  applyViewerTransform();
}

function showViewerItem(index) {
  unmountViewerMedia();
  const item = viewer.items[index];
  viewer.index = index;
  viewer.scale = 1;
  viewer.tx = 0;
  viewer.ty = 0;
  viewer.pair = viewerPair(item);
  mountViewerMedia(viewerThemed(item));
  applyViewerTransform();
  viewerDialog.classList.toggle("plot", item.tagName === "IFRAME");
  const lone = viewer.items.length < 2;
  for (const [name, atEnd] of [["prev", index === 0], ["next", index === viewer.items.length - 1]]) {
    const arrow = viewerDialog.querySelector(`[data-viewer="${name}"]`);
    arrow.hidden = lone;
    arrow.disabled = lone || atEnd;
  }
}

function stepViewer(delta) {
  const index = viewer.index + delta;
  if (index >= 0 && index < viewer.items.length) showViewerItem(index);
}

function openViewer(opener) {
  const target = viewerTarget(opener);
  if (!target || viewerDialog.open) return;
  // The step list is the gallery the item sits in; a figure outside one is alone, with no arrows.
  const block = opener.closest(".gallery-block");
  const items = block ? [...block.querySelectorAll(VIEWER_ITEMS)].filter((el) => el.getClientRects().length) : [target];
  viewer.items = items;
  viewer.opener = opener;
  viewerDialog.showModal();
  showViewerItem(viewer.items.indexOf(target));
}

function closeViewer() {
  viewerDialog.close();
}

// A dark pair swaps while it is open, whatever changed the theme: the toggle, the system, or Export PDF's light run.
// An open plot keeps the theme it opened with.
function rethemeViewer() {
  if (!viewerDialog.open || !viewer.pair) return;
  showViewerItem(viewer.index);
}

// A pointer's place in the stage, measured from its middle, where the media is centred.
function viewerPoint(x, y) {
  const box = viewerStage.getBoundingClientRect();
  return { x: x - box.left - box.width / 2, y: y - box.top - box.height / 2 };
}

function viewerPinchInfo() {
  const [a, b] = [...viewerPointers.values()];
  return { distance: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function wireViewer() {
  // Media is reachable by keyboard, so Enter or Space does what a click does. Mermaid draws after this script runs.
  const linkMedia = () => document.querySelectorAll(VIEWER_MEDIA).forEach((el) => { el.tabIndex = 0; });
