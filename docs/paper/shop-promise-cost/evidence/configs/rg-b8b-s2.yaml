  agent_view_size: 9
  slip_chance: 0
  siren: false
  order_needed: true
  cooking_needed: false
observation: symbolic
layout: procedural
layout_seed: null
total_timesteps: 2000000
success: env
reward_source: rm
bundle: /home/turbotowerlnx/Documents/Master/TFM/TFM-schema-rm-rl/.git/agent-memory/plans/farm-final-20261119/shop-well/regression/b8b-rebuilt
