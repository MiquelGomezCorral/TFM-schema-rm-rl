# X2 seed-3 confirmation of the best setting (8 environments, update ratio 8, no CRM), fixed layouts as the pilot.
# Run: scripts/train.sh tuning/dqn/confirm --parallel 1 --max-ram-gb 3
suite: x2c
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8-tf8
learners:
  dqn8-tf8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 8}}
arms: [farm]
seeds: [3]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
