# X2 round 3: CRM with a buffer that keeps as many env steps as the 100k plain buffer (3 transitions per env step -> 300k),
# to separate "CRM learns worse" from "CRM's buffer holds a third of the history". Cards, seeds, steps as round 1.
# Run: scripts/train.sh tuning/dqn/round3 --parallel 2 --max-ram-gb 8
suite: x2r3
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8-crm-buf300k
learners:
  dqn8-crm-buf300k: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 4, overrides: {buffer_size: 300000, dqn_num_envs: 8, counterfactual: true}}
arms: [farm]
seeds: [1, 2]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
