# X2 procedural check: the best setting (8 environments, update ratio 8, no CRM) trained on a new layout every episode
# (cards copied from the pilot with layout: procedural, layout_seed: null by x2's make_procedural_tasks.py) and evaluated
# on the same 10 held-out layouts for every run (eval_seed_base + i).
# Run seeds 1, 11, 21: with 8 environments, sub-env i is seeded run seed + i, so seeds 1 and 2 would share 7 of 8 layout streams.
# Run: scripts/train.sh tuning/dqn/procedural --parallel 3 --max-ram-gb 9
suite: x2p
tasks: experiments/benchmark/tuning/dqn/procedural/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8-tf8
learners:
  dqn8-tf8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 8}}
arms: [farm]
seeds: [1, 11, 21]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
