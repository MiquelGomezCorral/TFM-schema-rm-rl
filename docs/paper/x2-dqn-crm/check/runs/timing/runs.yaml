# X2 timing check: wall time of the three DQN set-ups run at the same moment on the same machine (DoorKey, seed 1, 100k steps),
# so the load is the same. Not a learning result (suite name outside x2*, so the analysis script skips it).
# Run: scripts/train.sh tuning/dqn/timing --parallel 3 --max-ram-gb 9
suite: timing
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn1
compare_learners: [dqn1, dqn8, dqn8-tf8]
learners:
  dqn1: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000}}
  dqn8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8}}
  dqn8-tf8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 8}}
arms: [farm]
seeds: [1]
total_timesteps: 100000
time_box_min: 30
only: [base-doorkey]
variants: []
