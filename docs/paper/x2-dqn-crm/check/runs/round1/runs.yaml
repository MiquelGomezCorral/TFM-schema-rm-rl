# X2 round 1: DQN with 8 environments and counterfactual experience (CRM), pilot setup.
# 2 base cards x 3 learners x seeds {1, 2}, FARM machines, 500k steps, greedy evaluation every 10k,
# buffer 100000, as experiments/benchmark/pilot/runs.yaml. The pilot's own bundles are reused.
# Run: scripts/train.sh tuning/dqn/round1 --parallel 3 --max-ram-gb 9
suite: x2r1
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8
compare_learners: [dqn8, dqn8-crm, dqn1-crm]
learners:
  dqn8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8}}
  dqn8-crm: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, counterfactual: true}}
  dqn1-crm: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, counterfactual: true}}
arms: [farm]
seeds: [1, 2]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
