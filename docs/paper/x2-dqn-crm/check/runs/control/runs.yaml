# X2 control: the pilot DQN (1 environment, no counterfactual experience) on the same code and machine as X2 round 1,
# so wall time and curves compare under the same load. Same cards, seeds, steps and buffer as round 1.
# Run: scripts/train.sh tuning/dqn/control --parallel 1 --max-ram-gb 3
suite: x2ctl
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn1
learners:
  dqn1: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000}}
arms: [farm]
seeds: [1, 2]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
