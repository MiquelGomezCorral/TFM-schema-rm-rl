# X2 round 4: 8-environment DQN with update ratio 8 (the round 2 choice) and a shorter exploration decay
# (exploration_fraction 0.2 = epsilon reaches end_e at 100k steps; the pilot used 0.35 = 175k). Same for both tasks.
# Cards, seeds, steps as round 1.
# Run: scripts/train.sh tuning/dqn/round4 --parallel 2 --max-ram-gb 6
suite: x2r4
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8-tf8-expl20
learners:
  dqn8-tf8-expl20: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 8, exploration_fraction: 0.2}}
arms: [farm]
seeds: [1, 2]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
