# X2 round 2: 8-environment DQN with a lower update ratio (train_frequency 8 and 16, counted in env steps; round 1 used 4).
# One setting per learner, same for both tasks. Cards, seeds, steps as round 1.
# Run: scripts/train.sh tuning/dqn/round2 --parallel 2 --max-ram-gb 6
suite: x2r2
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/
learner: dqn8-tf8
compare_learners: [dqn8-tf8, dqn8-tf16]
learners:
  dqn8-tf8: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 8}}
  dqn8-tf16: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 3, overrides: {buffer_size: 100000, dqn_num_envs: 8, train_frequency: 16}}
arms: [farm]
seeds: [1, 2]
total_timesteps: 500000
time_box_min: 150
only: [base-doorkey, base-unlock-pickup]
variants: []
