# Lanes test, 2026-11-22 (user, Q2-3 of the final-results page): FARM's machine for the 2 Lanes soft-only cards plus
# the world's own reward (1 per zombie killed). Same settings as the counted runs (farm/templates-60 family, 1.5M
# steps, embedding state encoding) except reward_source: both. Compare: machine alone (counted FARM runs), world
# alone (no-RM runs), machine + world (this). Renamed suite so no run name or lock meets a counted run.
suite: templates-lanes-both
tasks: experiments/benchmark/templates/tasks.json
bundles: experiments/benchmark/templates/bundles
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 1500000
reward_source: both
only: [tpl-absence-soft-1-nogoal, tpl-not-co-existence-soft-1-nogoal]
variants: []
