      const em = parseFloat(getComputedStyle(target).fontSize);
      if (target.matches(".parts")) target.classList.toggle("cols", width >= 40 * em);
      else target.classList.toggle("rail", width < target.children.length * 10 * em);
    }
  });
  // A block with long text is already a rail and stays one, so it is not observed.
  document.querySelectorAll(".steps:not(.rail)").forEach((block) => observer.observe(block));
}

// The Contents index: a control at the top left opens a side index of the sections and their block headings
// (see buildOutlines). A new visit starts closed; an open index is remembered for this page in this tab, so a refresh
// keeps it. Its folds are buttons, not <details>, so they never count as the reader's changes in readerIsBusy.
const TOC_READ_LINE = 24; // px under the bar: the last heading above this line is the one being read
function wireContents() {
  if (data.layout === "slides" || (data.sections || []).length < 3) return;
  const openKey = storageKey + ":toc-open";
  const narrow = matchMedia("(max-width: 899px)");
  const sectionEls = [...document.querySelectorAll("#root > section")]; // by position, so no id can hijack the lookup
  // An index entry is plain text: a Markdown link in a title would nest an <a> in the entry's own link.
  const label = (text) => inline(String(text ?? "").replace(/\[([^\]]+)\]\((?:[^()\s]|\([^()\s]*\))+\)/g, "$1"));
  // "Show only changes" hides entries the same way it hides their sections and blocks.
  const unchanged = (sectionEl, el = sectionEl) =>
    !changes || sectionEl.dataset.change === "added" || el.matches("[data-change]") || el.querySelector("[data-change]") ? "" : " data-unchanged";
  const subItems = (subs, n, sectionEl) => subs.map((sub, j) => {
    const block = sectionEl.querySelector(`[id="${CSS.escape(sub.id)}"]`).closest(".block");
    return `<li${unchanged(sectionEl, block)}><a href="#${escapeHtml(sub.id)}"><span class="n">${n}.${j + 1}</span><span>${label(sub.title)}</span></a></li>`;
  }).join("");
  // One outline, two views: `tail` is what the in-page list adds after a section's link (leader and reading time).
  const listOf = (tail = () => "") => outlines.map(({ id, subs }, i) => {
    const fold = subs.length
      ? `<button class="tw" type="button" aria-expanded="false" aria-label="Sub-sections of ${escapeHtml(data.sections[i].title)}"></button>`
      : '<span class="tw"></span>'; // a spacer, so titles line up
    const link = `<a href="#${escapeHtml(id)}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${label(data.sections[i].title)}</span></a>`;
    const sectionEl = sectionEls[i];
    return `<li${unchanged(sectionEl)}><div class="row">${fold}${link}${tail(i)}</div>${subs.length ? `<ol class="subs" hidden>${subItems(subs, i + 1, sectionEl)}</ol>` : ""}</li>`;
  }).join("");
  const list = listOf();
  const bar = document.getElementById("bar");
  bar.querySelector(".bar-row").insertAdjacentHTML("afterbegin", `<button class="toc-btn" type="button" aria-expanded="false" aria-controls="toc">${icon("list")}Contents</button>`);
  bar.insertAdjacentHTML("afterend", `<nav class="toc" id="toc" aria-label="Contents"><div class="toc-list"><ol>${list}</ol></div></nav><div class="toc-scrim"></div>`);
  const root = document.documentElement;
  const button = document.querySelector(".toc-btn"), toc = document.getElementById("toc");
  const scroller = toc.querySelector(".toc-list");
  const minutes = (i) => Math.max(1, Math.round(sectionEls[i].textContent.trim().split(/\s+/).length / 200));
  const reading = (i) => `<span class="lead"></span><span class="min">${minutes(i)} min</span>`;
  const pageToc = `<nav class="pagetoc" aria-label="Page contents"><button class="pt-head" type="button" aria-expanded="true" aria-controls="pt-list">Contents</button><div class="pt-list" id="pt-list"><ol>${listOf(reading)}</ol></div></nav>`;
  (document.querySelector("header .sub") ?? document.querySelector("header h1")).insertAdjacentHTML("afterend", pageToc);
  const isOpen = () => root.classList.contains("toc-open");

  // Scroll-spy: the section in view gets the highlighted row and opens its sub-sections; the one being read
  // inside it gets the guide line. Only the index's own list scrolls to keep that row visible, never the page.
  const secItems = [...scroller.querySelectorAll(":scope > ol > li")];
  const spy = outlines.map(({ id, subs }, i) => {
    const subItemsOf = secItems[i].querySelectorAll(":scope > .subs > li");
    return { li: secItems[i], el: sectionEls[i], subs: subs.map((sub, j) => ({ li: subItemsOf[j], el: sectionEls[i].querySelector(`[id="${CSS.escape(sub.id)}"]`) })) };
  });
  const setSubs = (li, open) => {
    li.querySelector(":scope > .subs").hidden = !open;
    li.querySelector(".tw").setAttribute("aria-expanded", String(open));
  };
  const shown = (el) => el.getClientRects().length > 0; // a folded section or a hidden block has no box
  let current = null, currentSub = null, queued = false;
  // A page that cannot scroll far enough never brings the last headings to the line, so a link the reader clicks
  // stays highlighted while its heading is on screen. The first mark after the jump records where the page
  // stopped; any other scroll position, or the heading leaving the window, hands control back to the spy.
  let pin = null;
  const mark = (force) => {
    if (!isOpen()) return;
    if (pin) {
      const top = pin.target.el.getBoundingClientRect().top;
      if (pin.y === null) pin.y = scrollY;
      if (scrollY !== pin.y || !shown(pin.target.el) || top < 0 || top >= innerHeight) pin = null;
    }
    const atEnd = scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 2; // a page that fits the window is at its top
    const line = bar.offsetHeight + TOC_READ_LINE;
    const reached = (el) => atEnd || el.getBoundingClientRect().top <= line;
    const inView = spy.filter((s) => shown(s.el));
    // The reached heading nearest the line; a split section lists its blocks out of page order.
    const sec = pin?.sec ?? inView.filter((s) => reached(s.el)).at(-1) ?? inView[0] ?? null;
    const sub = pin ? pin.sub : (sec?.subs ?? []).filter((s) => shown(s.el) && reached(s.el))
      .reduce((best, s) => !best || s.el.getBoundingClientRect().top > best.el.getBoundingClientRect().top ? s : best, null);
    if (sec === current && sub === currentSub && !force) return;
    if (sec !== current) {
      // Moving on shuts what the index opened by itself; a section the reader opened stays open.
      if (current?.li.dataset.auto) { setSubs(current.li, false); delete current.li.dataset.auto; }
      if (sec?.subs.length && sec.li.querySelector(":scope > .subs").hidden) { setSubs(sec.li, true); sec.li.dataset.auto = "1"; }
    }
    current?.li.classList.remove("on");
    currentSub?.li.classList.remove("on");
    sec?.li.classList.add("on");
    sub?.li.classList.add("on");
    current = sec;
    currentSub = sub;
    // A sub-section the reader folded away has no row to show; its section's row stands in.
    const row = sub && !sub.li.closest(".subs").hidden ? sub.li : sec?.li.querySelector(":scope > .row");
    if (!row) return;
    const at = row.getBoundingClientRect(), box = scroller.getBoundingClientRect();
    if (at.top < box.top) scroller.scrollTop += at.top - box.top - 8;
    else if (at.bottom > box.bottom) scroller.scrollTop += at.bottom - box.bottom + 8;
  };
  const schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; mark(); });
  };

  const setOpen = (open) => {
    root.classList.toggle("toc-open", open);
    button.setAttribute("aria-expanded", String(open));
    try { sessionStorage.setItem(openKey, open ? "1" : "0"); } catch { /* storage blocked */ }
    mark(true);
  };
  button.addEventListener("click", () => setOpen(!isOpen()));
  const toggleSubs = (fold) => {
    const li = fold.closest("li");
    setSubs(li, fold.getAttribute("aria-expanded") !== "true");
    delete li.dataset.auto; // now the reader's choice
  };
  document.querySelector(".pagetoc").addEventListener("click", (e) => {
    const fold = e.target.closest("button.tw");
    if (fold) return toggleSubs(fold);
    const head = e.target.closest(".pt-head");
    if (!head) return;
    const open = head.getAttribute("aria-expanded") !== "true";
    head.setAttribute("aria-expanded", String(open));
    document.getElementById("pt-list").hidden = !open;
  });
  scroller.addEventListener("click", (e) => {
    const fold = e.target.closest("button.tw");
    if (fold) return toggleSubs(fold);
    const id = e.target.closest("a")?.getAttribute("href").slice(1);
    const sec = spy.find((s) => s.el.id === id || s.subs.some((sub) => sub.el.id === id));
    if (!sec) return;
    const sub = sec.subs.find((s) => s.el.id === id) ?? null;
    pin = { y: null, sec, sub, target: sub ?? sec };
    schedule();
  });
  // A narrow window shows the index as a drawer: a jump from it, a tap on the scrim, or Escape closes it. The jump
  // moves focus to the heading (tabindex -1), so it does not fall to the body when the link disappears.
  document.addEventListener("click", (e) => {
    if (!isOpen() || !narrow.matches) return;
    if (e.target.closest(".toc a") || !e.target.closest(".toc, .toc-btn")) setOpen(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !isOpen() || !narrow.matches) return;
    setOpen(false);
    button.focus({ preventScroll: true });
  });
  for (const type of ["scroll", "resize", "load"]) addEventListener(type, schedule, { passive: true });
  document.addEventListener("toggle", schedule, true); // a section folded or unfolded changes what is in view
  document.addEventListener("change", schedule); // so does "Show only changes"
  let wasOpen = false;
  try { wasOpen = sessionStorage.getItem(openKey) === "1"; } catch { /* storage blocked */ }
  setOpen(wasOpen);
}

// A frame's address with the page's theme in `?theme=`, so a graph can follow the page. Other query parameters and
// the hash stay; a frame that ignores the parameter is unaffected.
function withTheme(src, theme) {
  const [, path, query = "", hash = ""] = String(src).match(/^([^?#]*)(?:\?([^#]*))?(#.*)?$/);
  const params = new URLSearchParams(query);
  params.set("theme", theme);
  return `${path}?${params}${hash}`;
}

// Only the renderer's own frames; a frame in an `html` block is the author's.
function themeFrames(theme) {
  for (const frame of document.querySelectorAll('figure[data-kind="frame"] > iframe[src]')) {
    const src = withTheme(frame.getAttribute("src"), theme);
    if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
  }
}

function currentTheme() {
  return document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light");
}

// The viewer: a click on a figure's media, or on a plot's maximize button, opens the page's own lightbox with zoom,
// pan and the gallery the figure came from. Native <dialog>, no library.
const VIEWER_MEDIA = 'figure[data-kind="image"] > img, figure[data-kind="mermaid"] > pre.mermaid > svg, .block[data-type="html"] > svg';
const VIEWER_OPENERS = `${VIEWER_MEDIA}, [data-frame-max]`;
const VIEWER_ITEMS = `${VIEWER_MEDIA}, figure[data-kind="frame"] > iframe`;
const ZOOM_MAX = 20;

const viewerDialog = document.getElementById("viewer");
const viewerStage = document.getElementById("viewer-stage");
const viewerNav = viewerDialog.querySelector(".viewer-nav");
const viewerText = document.getElementById("viewer-text");
const viewerTitle = viewerText.querySelector(".vt-title");
const viewerDesc = viewerText.querySelector(".vt-desc");
const viewerLink = viewerText.querySelector(".vt-link");
const viewer = { items: [], index: 0, opener: null, pair: null, media: null, scale: 1, tx: 0, ty: 0, reserve: false };
const viewerPointers = new Map();
let viewerPinch = null;
let viewerBackdrop = false;

// The element a click opens: the media itself, or the frame a maximize button sits over.
function viewerTarget(opener) {
  const button = opener.closest("[data-frame-max]");
  return button ? button.closest("figure").querySelector(":scope > iframe") : opener;
}

// A dark pair shows the twin the page's theme wears; both are already in the page, so a switch loads nothing.
function viewerPair(item) {
  const figure = item.parentElement;
  if (item.tagName !== "IMG" || !figure?.matches("figure")) return null;
  const light = figure.querySelector(":scope > img.light-only");
  const dark = figure.querySelector(":scope > img.dark-only");
  return light && dark ? { light, dark } : null;
}

function viewerThemed(item) {
  if (!viewer.pair) return item;
  return currentTheme() === "dark" ? viewer.pair.dark : viewer.pair.light;
}

// The stage holds the page's own element, so a GIF keeps animating and a diagram keeps its colours. A plot gets a
// fresh frame that reloads with the theme the viewer opened in, and keeps its own interaction.
function mountViewerMedia(element) {
  viewer.media = { element, parent: element.parentNode, next: element.nextSibling, copy: null };
  if (element.tagName === "IFRAME") {
    const copy = document.createElement("iframe");
    copy.src = withTheme(element.getAttribute("src"), currentTheme());
    copy.title = element.title;
    copy.setAttribute("sandbox", "allow-scripts");
    viewer.media.copy = copy;
    viewerStage.append(copy);
  } else {
    viewerStage.append(element);
  }
}

function unmountViewerMedia() {
  const media = viewer.media;
  viewer.media = null;
  if (!media) return;
  media.element.style.transform = "";
  if (!media.copy && media.parent) media.parent.insertBefore(media.element, media.next);
  viewerStage.replaceChildren();
  viewerStage.classList.remove("zoomed");
}

function applyViewerTransform() {
  const media = viewer.media;
  if (!media || media.copy) return;
  const moved = viewer.scale !== 1 || viewer.tx || viewer.ty;
  media.element.style.transform = moved ? `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})` : "";
  viewerStage.classList.toggle("zoomed", viewer.scale > 1);
}

// The media never leaves the stage: a zoomed edge stops at the stage's content box, so the inset the stage keeps at 1x
// shows at full zoom too. The content box has the same middle as the stage, which viewerPoint measures from.
function clampViewerPan() {
  if (!viewer.media || viewer.media.copy || viewer.scale <= 1) { viewer.tx = 0; viewer.ty = 0; return; }
  const style = getComputedStyle(viewerStage);
  const box = {
    width: viewerStage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight),
    height: viewerStage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom),
  };
  const drawn = viewer.media.element.getBoundingClientRect();
  const room = (side, view) => Math.max(0, (side - view) / 2);
  viewer.tx = Math.max(-room(drawn.width, box.width), Math.min(room(drawn.width, box.width), viewer.tx));
  viewer.ty = Math.max(-room(drawn.height, box.height), Math.min(room(drawn.height, box.height), viewer.ty));
}

// Zoom keeps the point under the cursor, or between two fingers, still; x and y are measured from the stage middle.
function zoomViewer(next, x = 0, y = 0) {
  if (!viewer.media || viewer.media.copy) return;
  const scale = Math.min(ZOOM_MAX, Math.max(1, next));
  if (scale === viewer.scale) return;
  const ratio = scale / viewer.scale;
  viewer.tx = x - ratio * (x - viewer.tx);
  viewer.ty = y - ratio * (y - viewer.ty);
  viewer.scale = scale;
  // Clamping reads the drawn box, so the new scale has to be on the element before it runs.
  applyViewerTransform();
  clampViewerPan();
  applyViewerTransform();
}

function resetViewerZoom() {
  viewer.scale = 1;
  viewer.tx = 0;
  viewer.ty = 0;
  applyViewerTransform();
}

// A figure's title, description and source link, read from its own figcaption while the media is still in the figure.
// The change badges are not part of the text. Media with no figure (an html block's SVG) has none.
function viewerCaption(item) {
  const caption = item.closest("figure")?.querySelector(":scope > figcaption")?.cloneNode(true);
  caption?.querySelectorAll(".pill.change").forEach((pill) => pill.remove());
  const title = caption?.querySelector(".fig-title");
  const link = caption?.querySelector(".fig-link");
  title?.remove();
  link?.remove();
  return { title, link, description: caption };
}

// A link alone is no caption.
const viewerHasText = (item) => {
  const { title, description } = viewerCaption(item);
  return Boolean(title?.textContent.trim() || description?.textContent.trim());
};

// The title and description under the stage. The block keeps its fixed place, empty, for a figure with no text
// while another in the open set has some (viewer.reserve); it is hidden only when none has any.
function showViewerText(item) {
  const { title, link, description } = viewerCaption(item);
  viewerTitle.replaceChildren(...(title?.childNodes ?? []));
  viewerDesc.replaceChildren(...(description?.childNodes ?? []));
  viewerTitle.hidden = !viewerTitle.textContent.trim();
  viewerDesc.hidden = !viewerDesc.textContent.trim();
  // The source link rides along only when there is text, on a line of its own outside the clamped boxes. A link inside
  // the text keeps its mouse click but leaves the Tab order: focusing one in a clamped box would scroll the box.
  const withLink = Boolean(link) && !(viewerTitle.hidden && viewerDesc.hidden);
  viewerLink.replaceChildren(...(withLink ? [link] : []));
  viewerLink.hidden = !withLink;
  viewerText.querySelectorAll(".vt-title a, .vt-desc a").forEach((a) => { a.tabIndex = -1; });
  viewerText.hidden = !viewer.reserve;
  fitViewerText();
}

// The text never scrolls: the title clamps to two lines in CSS, and the description to the whole lines left in the
// fixed space once the title, the source link's line, their gaps and the block's padding are out of it. Run when the
// text is shown and on resize.
function fitViewerText() {
  if (viewerText.hidden) return;
  const block = getComputedStyle(viewerText);
  const desc = getComputedStyle(viewerDesc);
  const link = viewerLink.hidden ? 0 : viewerLink.offsetHeight + parseFloat(getComputedStyle(viewerLink).marginTop);
  const room = viewerText.clientHeight - parseFloat(block.paddingTop) - parseFloat(block.paddingBottom) - viewerTitle.offsetHeight - parseFloat(desc.marginTop) - link;
  viewerText.style.setProperty("--vt-lines", Math.max(1, Math.floor(room / parseFloat(desc.lineHeight))));
}

function showViewerItem(index) {
  unmountViewerMedia();
  const item = viewer.items[index];
  showViewerText(item);
  viewer.index = index;
  viewer.scale = 1;
  viewer.tx = 0;
  viewer.ty = 0;
  viewer.pair = viewerPair(item);
  mountViewerMedia(viewerThemed(item));
  applyViewerTransform();
  viewerDialog.classList.toggle("plot", item.tagName === "IFRAME");
  viewerNav.hidden = viewer.items.length < 2; // a lone figure has no arrows row
  for (const [name, atEnd] of [["prev", index === 0], ["next", index === viewer.items.length - 1]]) {
    viewerDialog.querySelector(`[data-viewer="${name}"]`).disabled = atEnd;
  }
}

function stepViewer(delta) {
  const index = viewer.index + delta;
  if (index >= 0 && index < viewer.items.length) showViewerItem(index);
}

function openViewer(opener) {
  const target = viewerTarget(opener);
  if (!target || viewerDialog.open) return;
  // The step list is the gallery the item sits in; a figure outside one is alone, with no arrows.
  const block = opener.closest(".gallery-block");
  const items = block ? [...block.querySelectorAll(VIEWER_ITEMS)].filter((el) => el.getClientRects().length) : [target];
  viewer.items = items;
  viewer.reserve = items.some(viewerHasText); // read once: the text row, and so the stage, keep their size while stepping
  viewer.opener = opener;
  viewerDialog.showModal();
  showViewerItem(viewer.items.indexOf(target));
}

function closeViewer() {
  viewerDialog.close();
}

// A dark pair swaps while it is open, whatever changed the theme: the toggle, the system, or Export PDF's light run.
// An open plot keeps the theme it opened with.
function rethemeViewer() {
  if (!viewerDialog.open || !viewer.pair) return;
  showViewerItem(viewer.index);
}

// A pointer's place in the stage, measured from its middle, where the media is centred.
function viewerPoint(x, y) {
  const box = viewerStage.getBoundingClientRect();
  return { x: x - box.left - box.width / 2, y: y - box.top - box.height / 2 };
}

// A press that can close: the stage's empty area, or the blurred page around the panel. The dialog is the panel, so a
// press on its own padding has the dialog as target too; the page around it lies outside its box.
function viewerBackdropHit(e) {
  if (e.target === viewerStage) return true;
  if (e.target !== viewerDialog) return false;
  const box = viewerDialog.getBoundingClientRect();
  return e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom;
}

function viewerPinchInfo() {
  const [a, b] = [...viewerPointers.values()];
  return { distance: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function wireViewer() {
  // Media is reachable by keyboard, so Enter or Space does what a click does. Mermaid draws after this script runs.
  const linkMedia = () => document.querySelectorAll(VIEWER_MEDIA).forEach((el) => { el.tabIndex = 0; });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", linkMedia); else linkMedia();

  document.addEventListener("click", (e) => {
    const opener = e.target.closest?.(VIEWER_OPENERS);
    if (opener) openViewer(opener);
  });
  // Capture, so the keys a figure opens with and the viewer's own keys never reach the deck.
  document.addEventListener("keydown", (e) => {
    if (viewerDialog.open) {
      const actions = {
        ArrowLeft: () => stepViewer(-1),
        ArrowRight: () => stepViewer(1),
        "+": () => zoomViewer(viewer.scale * 1.5),
        "=": () => zoomViewer(viewer.scale * 1.5),
        "-": () => zoomViewer(viewer.scale / 1.5),
        "_": () => zoomViewer(viewer.scale / 1.5),
        "0": resetViewerZoom,
      };
      if (!actions[e.key]) return;
      e.preventDefault();
      e.stopPropagation();
      actions[e.key]();
      return;
    }
    if (!["Enter", " "].includes(e.key)) return;
    const opener = e.target.closest?.(VIEWER_OPENERS);
    if (!opener) return;
    e.preventDefault();
    e.stopPropagation();
    openViewer(opener);
  }, true);

  // Every wheel over the viewer belongs to the viewer, so the page behind never scrolls; a plot keeps its own.
  viewerDialog.addEventListener("wheel", (e) => {
    e.preventDefault();
    const point = viewerPoint(e.clientX, e.clientY);
    zoomViewer(viewer.scale * Math.exp(-e.deltaY / 300), point.x, point.y);
  }, { passive: false });

  viewerDialog.addEventListener("pointerdown", (e) => {
    viewerBackdrop = viewerBackdropHit(e);
    // A press on the media drags it; a press anywhere else is a close or a control.
    if (viewerBackdrop || !viewer.media?.element.contains(e.target) || viewer.media.copy) return;
    viewerPointers.set(e.pointerId, viewerPoint(e.clientX, e.clientY));
    viewerDialog.setPointerCapture(e.pointerId);
    if (viewerPointers.size === 2) viewerPinch = viewerPinchInfo();
  });
  viewerDialog.addEventListener("pointermove", (e) => {
    const from = viewerPointers.get(e.pointerId);
    if (!from) return;
    const point = viewerPoint(e.clientX, e.clientY);
    viewerPointers.set(e.pointerId, point);
    if (viewerPointers.size > 1) {
      const pinch = viewerPinchInfo();
      if (viewerPinch?.distance) {
        viewer.tx += pinch.x - viewerPinch.x;
        viewer.ty += pinch.y - viewerPinch.y;
        zoomViewer(viewer.scale * (pinch.distance / viewerPinch.distance), pinch.x, pinch.y);
      }
      viewerPinch = pinch;
      return;
    }
    if (viewer.scale > 1) {
      viewer.tx += point.x - from.x;
      viewer.ty += point.y - from.y;
      clampViewerPan();
      applyViewerTransform();
    }
  });
  // A press and a release both on the backdrop closes; a drag that merely ends there does not.
  const endPointer = (e) => {
    viewerPointers.delete(e.pointerId);
    if (viewerPointers.size < 2) viewerPinch = null;
  };
  viewerDialog.addEventListener("pointerup", (e) => {
    endPointer(e);
    if (viewerBackdrop && viewerBackdropHit(e)) closeViewer();
    viewerBackdrop = false;
  });
  viewerDialog.addEventListener("pointercancel", endPointer);
  // An image is natively draggable, and the capture would turn a drag into a cancelled pointer.
  viewerStage.addEventListener("dragstart", (e) => e.preventDefault());
  // The capture sends the gesture's double-click to the dialog, so the reset listens there and skips its own buttons.
  viewerDialog.addEventListener("dblclick", (e) => { if (!e.target.closest("[data-viewer], #viewer-text")) resetViewerZoom(); });

  viewerDialog.addEventListener("click", (e) => {
    const action = e.target.closest?.("[data-viewer]")?.dataset.viewer;
    if (action === "close") closeViewer();
    else if (action === "prev") stepViewer(-1);
    else if (action === "next") stepViewer(1);
    else if (action === "in") zoomViewer(viewer.scale * 1.5);
    else if (action === "out") zoomViewer(viewer.scale / 1.5);
  });
  viewerDialog.addEventListener("close", () => {
    unmountViewerMedia();
    viewer.items = [];
    viewer.pair = null;
    viewerPointers.clear();
    viewerPinch = null;
    viewerBackdrop = false;
    viewer.opener?.focus({ preventScroll: true });
    viewer.opener = null;
  });

  addEventListener("resize", () => { if (viewerDialog.open) fitViewerText(); });
  new MutationObserver(rethemeViewer).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  systemDark.addEventListener("change", rethemeViewer);
}

// The saved choice applies to every artifact; without one the page follows the system theme.
function wireTheme(bar) {
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem(themeKey);
    if (saved) root.dataset.theme = saved;
  } catch { /* storage blocked */ }
  const isDark = () => currentTheme() === "dark";
  const button = document.createElement("button");
  button.type = "button";
  const showTarget = () => {
    button.textContent = isDark() ? "\u2600\uFE0E" : "\u263E";
    button.title = `Switch to ${isDark() ? "light" : "dark"} mode`;
    button.setAttribute("aria-label", button.title);
    themeFrames(isDark() ? "dark" : "light");
  };
  button.addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem(themeKey, root.dataset.theme); } catch { /* storage blocked */ }
    showTarget();
  });
  systemDark.addEventListener("change", showTarget);
  showTarget();
  bar.append(button);
}

function wireSlides(bar) {
  document.body.classList.add("slides");
  const slides = [...document.querySelectorAll(".slide")];
  bar.insertAdjacentHTML("afterbegin", '<button type="button" data-step="-1" title="Previous slide" aria-label="Previous slide">‹</button><span></span><button type="button" data-step="1" title="Next slide" aria-label="Next slide">›</button>');
  let current = Math.min(Number(location.hash.slice(1)) || 0, slides.length - 1);
  const show = (index) => {
    current = Math.max(0, Math.min(index, slides.length - 1));
    slides.forEach((s, i) => s.classList.toggle("on", i === current));
    bar.querySelector("span").textContent = `${current + 1} / ${slides.length}`;
    history.replaceState(null, "", "#" + current);
  };
  bar.addEventListener("click", (e) => { if (e.target.dataset.step) show(current + Number(e.target.dataset.step)); });
  document.addEventListener("keydown", (e) => {
    if (viewerDialog.open) return; // the viewer owns the keys while it is open
    if (e.target.matches("textarea, input") || (e.key === " " && e.target.closest("button"))) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(current + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
  });
  show(current);
}

document.title = data.title || "Artifact";
document.body.insertAdjacentHTML("afterbegin", renderBar());
document.getElementById("root").innerHTML = renderHeader() + (data.sections || []).map(renderSection).join("");
markChangedItems();
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-only-changes]")) return;
  document.body.classList.toggle("only-changes", e.target.checked);
  if (e.target.checked) document.querySelectorAll("section:is([data-change], :has([data-change])) > details.sec").forEach((d) => { d.open = true; });
});
// Highlights toggle by reload, so off renders the version as a new page would: no marks, collapsed sections shut.
document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-highlights]")) return;
  const off = !e.target.checked;
  if (saveState(highlightsOffKey, off ? { version: data.version } : {})) return location.reload();
  e.target.checked = off; // the save failed, so the box goes back to what the page shows
  const row = e.target.closest(".change-tools");
  if (!row.querySelector(":scope > .pill.warn")) row.insertAdjacentHTML("beforeend", '<span class="pill warn" role="status">Not saved: this browser blocks page storage, so highlights stay on</span>');
});
// Any section holding picks, even inside collapsible rows, ends with the copy bar. Its button copies that
// section only; with picks in more than one section, a second button copies the whole page.
const pickSections = [...document.querySelectorAll("section")].filter((section) => section.querySelector(".decision, table.pick"));
const copyButtons = pickSections.length > 1
  ? '<button type="button" data-copy-decisions>Copy section decisions</button><button type="button" data-copy-decisions="all">Copy all decisions</button>'
  : '<button type="button" data-copy-decisions>Copy my decisions</button>';
for (const section of pickSections) {
  (section.querySelector(":scope > details.sec") || section).insertAdjacentHTML("beforeend", `<div class="copy-bar">${copyButtons} <span class="copy-status" hidden></span><pre class="copy-text" hidden></pre></div>`);
}
// A link to a section or sub-section, from the Contents index or anywhere on the page, unfolds it before the jump.
const unfold = (hash) => {
  let id = hash.slice(1);
  try { id = decodeURIComponent(id); } catch { /* a stray "%" stays as typed */ }
  const fold = id && document.getElementById(id)?.closest("section")?.querySelector(":scope > details.sec");
  if (fold) fold.open = true;
};
document.addEventListener("click", (e) => { const link = e.target.closest('a[href^="#"]'); if (link) unfold(link.getAttribute("href")); });
addEventListener("hashchange", () => unfold(location.hash));
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-fold]");
  if (button) document.querySelectorAll("details.sec").forEach((d) => { d.open = button.dataset.fold === "open"; });
});
unfold(location.hash);
const toolbar = document.createElement("div");
toolbar.className = "toolbar";
document.body.append(toolbar);
wireTheme(toolbar);
// Printing shows every row and section open and every frame loaded; afterprint shuts again what was shut.
// Ctrl+P prints the screen theme and does no frame preparation; Export PDF prepares first (see exportPdf).
addEventListener("beforeprint", openForPrint);
addEventListener("afterprint", restoreAfterPrint);
wireExports();
wireDecisions();
wireChipTips();
wireSteps();
wireViewer();
wireContents();
if (data.layout === "slides") wireSlides(toolbar);
// A page rewritten during a long run reloads itself, at most daily. A reload would undo what the
// reader opened or folded, so a tick is skipped while a row they opened is open or one they folded is shut, "Show only changes" is on,
// a textarea has focus, or a video is playing; the next tick tries again.
const refreshSeconds = Number(data.refresh);
if (refreshSeconds >= 10) {
  const openAtLoad = new Set(document.querySelectorAll("details[open]"));
  const readerIsBusy = () => document.body.classList.contains("only-changes")
    || viewerDialog.open
    || document.activeElement?.matches("textarea")
    || document.documentElement.classList.contains("print-layout")
    || [...document.querySelectorAll("video")].some((v) => !v.paused)
    || [...document.querySelectorAll("details")].some((d) => d.open !== openAtLoad.has(d));
  setInterval(() => { if (!readerIsBusy()) location.reload(); }, Math.min(refreshSeconds, 86400) * 1000);
}
</script>
</body>
</html>
