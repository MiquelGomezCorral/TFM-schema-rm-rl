[project]
name = "schema-rm-rl"
version = "0.1.0"
description = "Constrained natural-language to Reward Machine compiler"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flat-tool",
    "nl2ltl",
    "openai>=1.66",
    "python-dotenv>=1.0",
    "maikol-utils==0.8.2",
    "dash>=4,<5",
    "dash-cytoscape",
    "gymnasium==1.3.0",
    "minigrid==3.1.0",
    "numpy==2.5.3",
    "stable-baselines3==2.9.0",
    "torch==2.14.0",
    "transformers==5.17.0",
    "PyYAML==6.0.3",
    "pandas==2.3.3",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.md"]
"src.prompts.arm_fm" = ["*.md"]

[tool.pyright]
include = ["app"]
exclude = ["data/**", "logs/**", "models/**"]
extraPaths = ["app"]
typeCheckingMode = "off"

# ======================================================================================
#                                    LINT AND CHECKS
# ======================================================================================
[tool.ruff]
line-length = 100
src = ["app"]
extend-exclude = [".agents", "*.md", "dependencies"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PIE", "PTH",
    "TID", "S", "D", "C90", "PLR0913", "PLC0415", "ARG", "NPY", "T10", "RUF",
]
ignore = ["E501", "D1", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["D", "ARG", "S"]
"**/test_*.py" = ["D", "ARG", "S"]
"*.ipynb" = ["D", "E402", "F811"]

[tool.ruff.lint.pyflakes]
allowed-unused-imports = ["minigrid"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*CONFIG", "visit_*"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.path".msg = "No sys.path hacks; the editable install resolves imports."
"importlib.import_module".msg = "No dynamic imports; import at the top of the file."

[tool.importlinter]
root_packages = ["src", "scripts"]

[[tool.importlinter.contracts]]
name = "src never imports scripts"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["scripts"]

[[tool.importlinter.contracts]]
name = "config imports no project package"
type = "forbidden"
source_modules = ["src.config"]
forbidden_modules = ["src.arm_fm", "src.compiler", "src.engines", "src.models", "src.prompts", "src.utils", "src.web", "scripts"]
