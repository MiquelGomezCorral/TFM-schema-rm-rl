[project]
name = "schema-rm-rl"
version = "0.1.0"
description = "Constrained natural-language to Reward Machine compiler"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flat-tool",
    "nl2ltl",
    "openai>=1.66",
    "python-dotenv>=1.0",
    "maikol-utils==0.8.2",
    "dash>=4,<5",
    "dash-cytoscape",
    "accelerate==1.15.0",
    "gymnasium==1.3.0",
    "metaworld==3.1.1",
    "minigrid==3.1.0",
    "numpy==2.5.3",
    "tianshou==2.0.1",
    "torch==2.14.0",
    "transformers==5.17.0",
    "xminigrid==0.9.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.md"]
"src.prompts.arm_fm" = ["*.md"]

[tool.pyright]
include = ["app"]
exclude = ["data/**", "logs/**", "models/**"]
extraPaths = ["app"]
typeCheckingMode = "off"
