[project]
name = "schema-rm-rl"
version = "0.1.0"
description = "Constrained natural-language to Reward Machine compiler"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flat-tool",
    "nl2ltl",
    "openai>=1.66",
    "dash>=4,<5",
    "dash-cytoscape",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.md"]

[tool.pyright]
include = ["app"]
exclude = ["data/**", "logs/**", "models/**"]
extraPaths = ["app"]
typeCheckingMode = "off"
