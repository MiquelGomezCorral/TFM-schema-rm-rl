# Templates suite: the 26 trained template cards (11 hard: the k = 1 cards that still train,
# tpl-responded-existence-2-nogoal, the three k = 4 ServiceRoom cards and tpl-existence-two-5-nogoal;
# 15 soft: the `-soft-1-` cards) x 3 arms x 3 seeds = 234 runs. `only: []` takes every card with train: true, so the soft cards need no list here.
suite: templates
tasks: experiments/benchmark/templates/tasks.json
bundles: experiments/benchmark/templates/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}   # ram_gb: estimate until the pilot measures it
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only: []                # a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with train: true
variants: []
