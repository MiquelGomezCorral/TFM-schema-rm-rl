# Templates suite: the 16 trained template cards (8 templates x with/without goal, k = 1)
# x 3 arms x seeds = 48 runs at 1 seed.
suite: templates
tasks: experiments/benchmark/templates/tasks.json
bundles: experiments/benchmark/templates/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: TBD            # dqn or ppo, set after the pilot (D6); run-suite refuses TBD except --dry-run
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}   # ram_gb: estimate, to be set by L7.1
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: []                # empty = every card with train: true
variants: []
