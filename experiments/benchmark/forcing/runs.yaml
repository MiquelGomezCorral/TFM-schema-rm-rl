# Forcing suite: the 4 forcing cards (lanes-guard, lanes-rules, keygift-hard, keygift-soft)
# x 2 arms x seeds = 8 runs at 1 seed. The world forces the trigger, so an idle agent fails (see README.md).
suite: forcing
tasks: experiments/benchmark/forcing/tasks.json
bundles: experiments/benchmark/forcing/bundles  # <bundles>/<arm>/<card-id>/ for farm (no-rm needs none)
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: []                # a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with train: true
variants: []
