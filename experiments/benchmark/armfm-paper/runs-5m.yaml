# ARM-FM paper cards at 5M steps: DoorKey 16x16 (new maps and fixed map) and BabyAI UnlockToUnlock.
# Train: python app/main.py run-suite --suite experiments/benchmark/armfm-paper/runs-5m.yaml  (cards: README.md)
suite: armfm-paper
tasks: experiments/benchmark/armfm-paper/tasks.json
bundles: experiments/benchmark/armfm-paper/bundles   # <bundles>/<arm>/<card-id>/
learner: ppo            # the learner of the counted MiniGrid cards (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 5000000  # user D3
only: [armfm-doorkey-16x16, armfm-doorkey-16x16-fixed, armfm-unlock-to-unlock]
variants: []
