# DoorKey 16x16 fixed map, extra seeds 4-8 for both machine arms (side check, 2026-11-23). The counted
# armfm-paper result keeps seeds 1-3 (runs.yaml). FARM seed 3 never opened the door there in 5M steps while seeds 1
# and 2 did; this layout (seed 1) is harder than 96% of random ones, so the extra seeds measure how often a seed
# misses the first door opening. Own suite name, so its run folders and lock stay apart from armfm-paper.
# Train: python app/main.py run-suite --suite <this file>, or cluster_runs.py submit <this file>
suite: armfm-paper-rerun
tasks: experiments/benchmark/armfm-paper/tasks.json
bundles: experiments/benchmark/armfm-paper/bundles   # <bundles>/<arm>/<card-id>; the fixed card reads its bundle_of card's
learner: ppo            # the learner of the counted MiniGrid cards (setting s07)
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm, arm-fm]
seeds: [4, 5, 6, 7, 8]
total_timesteps: 5000000
only: [armfm-doorkey-16x16-fixed]
variants: []
