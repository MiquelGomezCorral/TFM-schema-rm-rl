# ARM-FM paper cards at 1.5M steps: DoorKey 5x5 (new maps and fixed map) and DoorKey 8x8 fixed map.
# Train: python app/main.py run-suite --suite experiments/benchmark/armfm-paper/runs.yaml  (cards: README.md)
suite: armfm-paper
tasks: experiments/benchmark/armfm-paper/tasks.json
bundles: experiments/benchmark/armfm-paper/bundles   # <bundles>/<arm>/<card-id>/; base/<card> borrows base's
learner: ppo            # the learner of the counted MiniGrid cards (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000  # user D3
only: [armfm-doorkey-5x5, armfm-doorkey-5x5-fixed, armfm-doorkey-8x8-fixed]
variants: []
