# Lanes spacing test (user, 2026-11-23), no RM: the world's own reward alone on the 8 spacing cards, so the closer-lane
# worlds have their no-RM baseline. 4 cards x 2 spacings x 3 seeds = 24 runs (identical envs may share a run, see the dry run).
# Same settings as no-rm/forcing.yaml and no-rm/templates-60.yaml and a renamed suite.
# 2026-11-23 root: tpl-existence-two-5-nogoal-spacing1 dropped (a random agent passes it on 68 of 100 seeds, review P2).
suite: lanes-spacing
tasks: experiments/benchmark/lanes-spacing/tasks.json
bundles: experiments/benchmark/lanes-spacing/bundles   # no-rm needs none
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only:
  - lanes-guard-spacing2
  - lanes-rules-spacing2
  - tpl-absence-soft-1-nogoal-spacing2
  - tpl-existence-two-5-nogoal-spacing2
  - lanes-guard-spacing1
  - lanes-rules-spacing1
  - tpl-absence-soft-1-nogoal-spacing1
variants: []
