# Lanes spacing test, FARM with the world's kill reward added (user, 2026-11-23): runs-farm.yaml with reward_source: both,
# so the learner gets the machine's reward plus the world's +1 per zombie killed (RewardMachineObservation adds the raw env
# reward to the machine reward). Cards lanes-guard and lanes-rules at every spacing the study trained: 4 (the counted
# cards of the forcing suite, their own FARM bundles), 2 and 1 (the spacing copies, bundle_of the same bundles).
# 2 cards x 3 spacings x 3 seeds = 18 runs. Only reward_source differs from runs-farm.yaml and forcing/runs.yaml (farm arm);
# the renamed suite keeps run names and locks apart from theirs.
suite: lanes-both
tasks:
  - experiments/benchmark/lanes-spacing/tasks.json
  - experiments/benchmark/forcing/tasks.json
bundles: experiments/benchmark/forcing/bundles   # cards without bundle_of (spacing 4) read <bundles>/farm/<card>; the copies read bundle_of's suite
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
reward_source: both
only:
  - lanes-guard
  - lanes-rules
  - lanes-guard-spacing2
  - lanes-rules-spacing2
  - lanes-guard-spacing1
  - lanes-rules-spacing1
variants: []
