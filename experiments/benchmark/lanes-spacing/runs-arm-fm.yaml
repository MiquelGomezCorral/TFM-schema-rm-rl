# Lanes spacing test (user, 2026-11-23), ARM-FM: only the machine that passed armfm_gate in the new worlds. Of the 4 cards
# per spacing only tpl-existence-two-5-nogoal has a passing ARM-FM Lanes bundle; the other three (lanes-guard, lanes-rules,
# tpl-absence-soft-1-nogoal) fail "pay_order plan_check solve-s1: ends the episode before the agent acts", like their
# counted ARM-FM bundles (lanes-nogap/gate-armfm), so they do not train. 1 card x 2 spacings x 3 seeds = 6 runs.
# Same settings as arm-fm/templates-60.yaml and a renamed suite.
# 2026-11-23 root: tpl-existence-two-5-nogoal-spacing1 dropped (a random agent passes it on 68 of 100 seeds, review P2).
suite: lanes-spacing
tasks: experiments/benchmark/lanes-spacing/tasks.json
bundles: experiments/benchmark/lanes-spacing/bundles   # empty: every card has bundle_of, so run-suite reads the sibling suite's bundles
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [arm-fm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only: [tpl-existence-two-5-nogoal-spacing2]
variants: []
