# Lanes spacing test (user, 2026-11-23): the trained Lanes cards in two closer-lane worlds (lane_spacing 2 = lanes with one
# free row between, 11x7 grid; lane_spacing 1 = lanes touching, 11x5 grid; the default 4 is the counted world). Each card is
# a copy of a counted card with bundle_of: it trains on the counted FARM machine, whose labeling reads only the four events.
# 4 cards x 2 spacings x 3 seeds = 24 runs. Gates: gate_all_pool4 passed on all 8 (lanes-nogap/gate-explore), C8 ran on the
# originals. Same settings as the counted runs (farm/forcing.yaml, farm/templates-60.yaml) and a renamed suite.
# 2026-11-23 root: tpl-existence-two-5-nogoal-spacing1 dropped (a random agent passes it on 68 of 100 seeds, review P2).
suite: lanes-spacing
tasks: experiments/benchmark/lanes-spacing/tasks.json
bundles: experiments/benchmark/lanes-spacing/bundles   # empty: every card has bundle_of, so run-suite reads the sibling suite's bundles
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only:
  - lanes-guard-spacing2
  - lanes-rules-spacing2
  - tpl-absence-soft-1-nogoal-spacing2
  - tpl-existence-two-5-nogoal-spacing2
  - lanes-guard-spacing1
  - lanes-rules-spacing1
  - tpl-absence-soft-1-nogoal-spacing1
variants: []
