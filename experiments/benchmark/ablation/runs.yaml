# Ablation suite: 3 cards of different sizes (two complex, one Lanes), FARM only, one machine per reward part
# turned off (6 variants) plus the `none` control x 3 seeds = 63 runs. The control is the variants' own
# source machine with nothing off (`off-none`): the reference machine in forcing/reference for lanes-rules, the
# complex suite's FARM bundle for cx-goal-*. Machines come from `ablate-rm`: <bundles>/<card-id>/off-<variant>/.
# The cards are those listed in `ablation.json` (see `only`); their content lives in complex/tasks.json
# and forcing/tasks.json (the Lanes soft-rules card replaced cx-rules-only).
suite: ablation
tasks: [experiments/benchmark/complex/tasks.json, experiments/benchmark/forcing/tasks.json]   # card content; the 3 cards are picked by `only`
bundles: experiments/benchmark/ablation/bundles
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}   # ram_gb: estimate until the pilot measures it
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only: experiments/benchmark/complex/ablation.json   # a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with train: true. Keep it as the 3-card file: an empty `only` would select every train card of both task files (more than 3 cards x 7 variants)
variants: [none, progress, well, soft_break, soft_pending, end_judgment, recurrent_soft_penalty]
