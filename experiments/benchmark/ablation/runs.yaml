# Ablation suite: 3 complex cards of different sizes, FARM only, one machine per reward part
# turned off (6 variants) = 18 runs at 1 seed. The control is the complex suite's full FARM run
# of the same card. Machines come from `ablate-rm`: <bundles>/<card-id>/off-<variant>/.
suite: ablation
tasks: experiments/benchmark/complex/ablation.json   # 3 cards, each with train: true
bundles: experiments/benchmark/ablation/bundles
learner: TBD            # dqn or ppo, set after the learner pilot; run-suite refuses TBD except --dry-run
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}   # ram_gb: estimate until the pilot measures it
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: []                # empty = every card with train: true
variants: [progress, well, soft_break, soft_pending, end_judgment, recurrent_soft_penalty]
