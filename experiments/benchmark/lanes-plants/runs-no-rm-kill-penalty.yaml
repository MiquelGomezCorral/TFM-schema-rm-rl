# Lanes plant world (user, 2026-11-24), no RM, kill reward plus breach penalty: `kill_reward: 1`, `breach_reward: -1` (+1 per
# zombie killed, -1 per zombie through any lane), in the cards' env_kwargs (tasks-kill-penalty.json). Spacings 4, 3 and 2 with
# `fixed_plants`, `end_on_top_breach` and `plant_stun_steps: 2`. 2 cards x 3 spacings x 3 seeds = 18 rows, 9 trainings, both cards judged on each.
# Same settings as runs-no-rm-kill.yaml; only the cards' reward options and the suite name differ.
suite: lanes-plants-no-rm-kill-penalty
tasks: experiments/benchmark/lanes-plants/tasks-kill-penalty.json
bundles: experiments/benchmark/lanes-plants/bundles   # no-rm needs none
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only:
  - lanes-guard-plants-spacing4
  - lanes-guard-plants-spacing3
  - lanes-guard-plants-spacing2
  - lanes-rules-plants-spacing4
  - lanes-rules-plants-spacing3
  - lanes-rules-plants-spacing2
variants: []
