# Lanes plant world (user, 2026-11-24), no RM, the world's own reward: +1 per zombie killed (the env default), nothing for a
# breach. runs-no-rm.yaml of lanes-spacing on the plant-world cards: spacings 4, 3 and 2 with `fixed_plants`,
# `end_on_top_breach` and `plant_stun_steps: 2`. 2 cards x 3 spacings x 3 seeds = 18 rows, 9 trainings: the guard and rules cards of a spacing share
# one env, so one run trains it and the other card is judged on it (see the dry run). Same settings as lanes-spacing/runs-no-rm.yaml.
suite: lanes-plants-no-rm-kill
tasks: experiments/benchmark/lanes-plants/tasks.json
bundles: experiments/benchmark/lanes-plants/bundles   # no-rm needs none
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only:
  - lanes-guard-plants-spacing4
  - lanes-guard-plants-spacing3
  - lanes-guard-plants-spacing2
  - lanes-rules-plants-spacing4
  - lanes-rules-plants-spacing3
  - lanes-rules-plants-spacing2
variants: []
