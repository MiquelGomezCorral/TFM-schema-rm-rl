# Lanes plant world (user, 2026-11-24), FARM: runs-farm.yaml of lanes-spacing on the plant-world cards. Spacings 4, 3 and 2,
# each with `fixed_plants` (3 * (spacing - 1) plants on random free cells off the lanes at every reset, no sprouting) and
# `end_on_top_breach` (a top breach ends the episode) and `plant_stun_steps: 2` (stepping onto a plant freezes the agent's
# cell and facing for 2 steps). Each card is a copy of a counted card with bundle_of: it trains on
# the counted FARM machine, whose labeling reads only the four events. Guard and rules cards = 2 groups, 2 x 3 spacings x
# 3 seeds = 18 runs. Same settings as lanes-spacing/runs-farm.yaml and a renamed suite.
suite: lanes-plants
tasks: experiments/benchmark/lanes-plants/tasks.json
bundles: experiments/benchmark/lanes-plants/bundles   # empty: every card has bundle_of, so run-suite reads forcing/bundles
learner: ppo            # the learner of the tuning program (setting s07); every thesis run used it
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
only:
  - lanes-guard-plants-spacing4
  - lanes-guard-plants-spacing3
  - lanes-guard-plants-spacing2
  - lanes-rules-plants-spacing4
  - lanes-rules-plants-spacing3
  - lanes-rules-plants-spacing2
variants: []
