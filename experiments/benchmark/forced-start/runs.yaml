# Forced-start suite: the 2 forced-start cards (tpl-response-1-nogoal-forced, tpl-responded-existence-1-nogoal-forced)
# x 3 arms x seeds = 6 runs at 1 seed. The rule's trigger is already true at the first step (see README.md).
suite: forced-start
tasks: experiments/benchmark/forced-start/tasks.json
bundles: experiments/benchmark/forced-start/bundles  # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: []                # a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with train: true
variants: []
