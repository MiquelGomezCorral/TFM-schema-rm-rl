# Example for REPRODUCE 6.12: the two ServiceRoom cards (siren, box) trained as one mix, and each alone
# for the comparison. A suite cannot hold mixes without the single-card runs: an empty `only` means every
# card with `train: true`, so `only` names the two cards and the single runs are the baselines.
# Runs: 2 cards x 2 arms + 1 mix x 2 arms = 6, named bench__complex-mixes__<id>__<arm>__<learner>.
# A mix has no no-rm arm (without a machine its cards are one task), so `arms` leaves it out too.
suite: complex-mixes
tasks: experiments/benchmark/complex/tasks.json
bundles: experiments/benchmark/complex/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [arm-fm, farm]
seeds: [1]
total_timesteps: 100000   # the mix gets the same steps as one card alone
only: [cx-siren, cx-box]
variants: []
mixes:
  - {id: siren-box, cards: [cx-siren, cx-box]}
