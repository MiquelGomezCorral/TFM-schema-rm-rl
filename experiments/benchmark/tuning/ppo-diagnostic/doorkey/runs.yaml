# PPO diagnostic, DoorKey 8x8 without the Reward Machine (env reward only), s07, 500k steps, the
# five seeds. Answers whether the plain PPO baseline needs the Reward Machine on the easy card.
# Run: setsid nohup experiments/benchmark/scripts/train.sh tuning/ppo-diagnostic/doorkey --parallel 2 --max-ram-gb 7.5
suite: ppo-diag-doorkey
tasks: experiments/benchmark/tuning/ppo-diagnostic/tasks.json
bundles: experiments/benchmark/pilot/bundles
learner: s07
compare_learners: [s07]
learners:
  s07:
    config: experiments/benchmark/configs/ppo.yaml
    ram_gb: 2.4
    overrides:
      ppo_learning_rate: 1.0e-3
      ppo_num_envs: 16
      ppo_num_steps: 256
      ppo_num_minibatches: 16
      ppo_update_epochs: 10
      ppo_clip_coef: 0.1
      ppo_clip_vloss: true
      ppo_ent_coef: 0.01
arms: [no-rm]
seeds: [1, 2, 3, 4, 21]
total_timesteps: 500000
time_box_min: 60
only: [base-doorkey]
variants: []
