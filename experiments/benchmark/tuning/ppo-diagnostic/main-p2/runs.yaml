# Phase 2 of main-p1 (same suite name and learners): seeds 3 and 21. Settings and why:
# plans/testing-program-20261111/slices/ppo-diagnostic/settings.md.
# Run: setsid nohup experiments/benchmark/scripts/train.sh tuning/ppo-diagnostic/main-p2 --parallel 2 --max-ram-gb 7.5
suite: ppo-diag-main
tasks: experiments/benchmark/tuning/ppo-diagnostic/tasks.json
bundles: experiments/benchmark/pilot/bundles
learner: s07
compare_learners: [s07, s07-tuned]
learners:
  s07: &s07
    config: experiments/benchmark/configs/ppo.yaml
    ram_gb: 2.4
    overrides: &s07-values
      ppo_learning_rate: 1.0e-3
      ppo_num_envs: 16
      ppo_num_steps: 256
      ppo_num_minibatches: 16
      ppo_update_epochs: 10
      ppo_clip_coef: 0.1
      ppo_clip_vloss: true
      ppo_ent_coef: 0.01
  s07-tuned: # s07 + policy clip 0.2 + no value clip
    <<: *s07
    overrides:
      <<: *s07-values
      ppo_clip_coef: 0.2
      ppo_clip_vloss: false
arms: [farm, no-rm]
seeds: [3, 21]
total_timesteps: 1500000
time_box_min: 120
only: [base-unlock-pickup]
variants: []
