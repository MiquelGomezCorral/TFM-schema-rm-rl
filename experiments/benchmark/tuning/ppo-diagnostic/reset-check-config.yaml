# Run config of the PPO diagnostic (setting s07, procedural UnlockPickup, FARM bundle), as
# run-suite writes it; reset_check.py reads it to build the training vector env.
algorithm: ppo
ppo_learning_rate: 0.001
ppo_num_envs: 16
ppo_num_steps: 256
ppo_num_minibatches: 16
ppo_update_epochs: 10
ppo_clip_coef: 0.1
ppo_ent_coef: 0.01
ppo_vf_coef: 0.5
ppo_gae_lambda: 0.95
gamma: 0.99
eval_greedy: true
exp_name: ppo-diagnostic-reset-check
env_family: minigrid
gym_id: MiniGrid-UnlockPickup-v0
env_kwargs: {}
observation: symbolic
layout: procedural
layout_seed: null
total_timesteps: 1500000
success: env
reward_source: rm
bundle: experiments/benchmark/pilot/bundles/farm/base-unlock-pickup
time_limit_penalty: 0.0
