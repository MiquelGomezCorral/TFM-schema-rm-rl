# Base suite: the 4 MiniGrid base-paper tasks x 3 arms x seeds = 12 runs at 1 seed.
# Train: python app/main.py run-suite --suite experiments/benchmark/base/runs.yaml  (or scripts/train.sh base)
suite: base
tasks: experiments/benchmark/base/tasks.json
bundles: experiments/benchmark/base/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: dqn            # won the learner pilot: solved 0.77 of greedy eval points, PPO 0.41
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}   # ram_gb: estimate until the pilot measures it
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: []                # a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with train: true
variants: []
