# PPO learner of the thesis benchmark. run-suite adds the card, the arm and the seed on top.
# Calibration (disclosed in REPRODUCE.md): the CleanRL MiniGrid values, not ARM-FM Table 6
# (lr 5e-5, 4 envs). Evaluation is greedy so PPO and DQN are compared like with like.
algorithm: ppo
ppo_learning_rate: 2.5e-4
ppo_num_envs: 8
ppo_num_steps: 128
ppo_num_minibatches: 4
ppo_update_epochs: 4
ppo_clip_coef: 0.1
ppo_ent_coef: 0.01
ppo_vf_coef: 0.5
ppo_gae_lambda: 0.95
gamma: 0.99
eval_greedy: true
