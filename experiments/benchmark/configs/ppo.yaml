# PPO learner of the thesis benchmark. run-suite adds the card, the arm and the seed on top.
# Setting s07 (x1 tuning): the CleanRL MiniGrid values (lr 2.5e-4, 8 envs, rollout 128, 4
# minibatches, 4 epochs) never solved UnlockPickup, so updates are harder: lr 1e-3, 16 envs,
# rollout 256, 16 minibatches, 10 epochs. It stays s07 until the PPO diagnostic picks a
# setting (plans/testing-program-20261111/slices/ppo-diagnostic/settings.md). Not ARM-FM
# Table 6 (lr 5e-5, 4 envs). Evaluation is greedy so PPO and DQN are compared like with like.
algorithm: ppo
ppo_learning_rate: 1.0e-3
ppo_num_envs: 16
ppo_num_steps: 256
ppo_num_minibatches: 16
ppo_update_epochs: 10
ppo_clip_coef: 0.1
ppo_ent_coef: 0.01
ppo_vf_coef: 0.5
ppo_gae_lambda: 0.95
gamma: 0.99
eval_greedy: true
