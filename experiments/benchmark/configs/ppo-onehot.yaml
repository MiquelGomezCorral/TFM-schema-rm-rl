# PPO learner, standard settings (ppo.yaml, s07) with the RM state one-hot. A shop ladder side test
# (2026-11-23): FARM on the same settings as the no-RM shop runs, to see if the settings are why FARM
# never serves. Only rm_state_encoding differs from ppo.yaml.
algorithm: ppo
ppo_learning_rate: 1.0e-3
ppo_num_envs: 16
ppo_num_steps: 256
ppo_num_minibatches: 16
ppo_update_epochs: 10
ppo_clip_coef: 0.1
ppo_ent_coef: 0.01
ppo_vf_coef: 0.5
ppo_gae_lambda: 0.95
gamma: 0.99
eval_greedy: true
# Evaluation every 50k steps, not the 10k default: at 10k it took 20-65% of a run's wall time
# with 15+ runs on the machine (batch check, 2026-11-21). The final 100-episode score is unchanged.
eval_frequency: 50000
rm_state_encoding: one_hot
