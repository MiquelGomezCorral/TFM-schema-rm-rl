# PPO learner of the shop levels. run-suite adds the card, the arm and the seed on top.
# Set P1: the values of the round 6 and 7 shop runs that learned (r7-B8b served 12.2/12.1/12.2
# per episode, outputs/round7/configs/r7-B8b-s*.yaml in tp-shop-pay-test). It is s07 (ppo.yaml)
# with clip 0.2 instead of 0.1, gamma 0.995 instead of 0.99, value clipping on and evaluation every
# 50,000 steps. The RM state is one-hot for the shop tests; only the final test uses embeddings.
algorithm: ppo
ppo_learning_rate: 1.0e-3
ppo_num_envs: 16
ppo_num_steps: 256
ppo_num_minibatches: 16
ppo_update_epochs: 10
ppo_clip_coef: 0.2
ppo_clip_vloss: true
ppo_ent_coef: 0.01
ppo_vf_coef: 0.5
ppo_gae_lambda: 0.95
gamma: 0.995
eval_greedy: true
eval_frequency: 50000
rm_state_encoding: one_hot
