# DQN learner of the thesis benchmark. run-suite adds the card, the arm and the seed on top.
# Calibration (disclosed in REPRODUCE.md): the working schedule of the peer EXPERIMENTS
# session, not ARM-FM Table 5 (gamma 0.99, learning_starts 80000, end_e 0.01, batch 32).
algorithm: dqn
double_q: true
gamma: 0.95
learning_starts: 20000
end_e: 0.05
batch_size: 128
buffer_size: 1000000
