# Box-carry suite: the 3 trained carry cards (tpl-chain-response-1-goal-carry,
# tpl-chain-response-1-nogoal-carry, cx-box-carry) x 3 arms x 3 seeds = 27 runs. The agent starts holding the box (see README.md).
suite: box-carry
tasks: experiments/benchmark/box-carry/tasks.json
bundles: experiments/benchmark/box-carry/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1, 2, 3]        # every training test runs 3 seeds
total_timesteps: 1500000
# a list of card ids, or the path of a JSON card file whose ids are used; empty = every card with
# train: true. Listed, since the two fall-turn copies train from runs-fall-turn.yaml only.
only: [tpl-chain-response-1-goal-carry, tpl-chain-response-1-nogoal-carry, cx-box-carry]
variants: []
