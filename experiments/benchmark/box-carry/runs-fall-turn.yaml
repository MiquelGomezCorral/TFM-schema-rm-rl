# Box-carry fall-turn runs: the three world-setting copies of tpl-chain-response-1-goal-carry
# (fall_turn none, side and half, see README.md) train on that card's FARM machine (bundle_of):
# 3 cards x FARM x 3 seeds = 9 runs. They have no bundle of their own and no no-RM or ARM-FM arm here.
suite: box-carry
tasks: experiments/benchmark/box-carry/tasks.json
bundles: experiments/benchmark/box-carry/bundles   # <bundles>/farm/<bundle_of card>/
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 1500000
only: [tpl-chain-response-1-goal-carry-noturn, tpl-chain-response-1-goal-carry-backturn, tpl-chain-response-1-goal-carry-half]
variants: []
