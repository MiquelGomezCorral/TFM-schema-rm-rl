# shop two jobs, 2026-11-25, FARM arm. User aim: "if we cannot learn three things at the same time, at least see if we can
# get two". Four tasks, each a serving job plus one hard part: serve + falls (deliver only, food falls), serve + siren
# (deliver only, siren, no falls), full serve + falls (order, cook, deliver, falls, no siren), full serve + siren (order,
# cook, deliver, siren, no falls). Each at area 3, 5 and 7 and grown (area 7 reached through 3 x 3 and 5 x 5): 16 cards
# `shop-two-<task>-<size>` of experiments/benchmark/shop/tasks.json, every card a world copy of its task's machine card
# (bundle_of): shop-ladder-deliver, shop-ladder-deliver-siren, shop-serve, shop-full.
# Curriculum: at a fixed size the agent first plays the task with the hard part off (no falls: slip_chance 0; no siren), then
# the task. A grown card plays 3 x 3 with the hard part off, 3 x 3 with it on, 5 x 5 with it on, then 7 x 7. A stage ends when the
# last 100 finished training episodes serve 60% of the scripted worker's mean in that stage's world, catch 90% of the falls
# when it has slips and switch off 90% of the sirens when it has the siren (README, "Curriculum" and "Two jobs").
# One learner, the shop preset ppo-shop.yaml (one-hot RM state), 5M steps, RM reward alone, 3 seeds. 16 cards x 3 seeds
# = 48 runs. Evaluation and the judge play the final world of each card. These cards are not among the counted 60 (train: false).
# Same cards and learner settings: runs-two-no-rm.yaml (the shop's own reward).
# Train: python app/main.py run-suite --suite <this file>
suite: shop-two
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-shop.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-two-serve-falls-3x3, shop-two-serve-falls-5x5, shop-two-serve-falls-7x7, shop-two-serve-falls-grow, shop-two-serve-siren-3x3, shop-two-serve-siren-5x5, shop-two-serve-siren-7x7, shop-two-serve-siren-grow, shop-two-full-falls-3x3, shop-two-full-falls-5x5, shop-two-full-falls-7x7, shop-two-full-falls-grow, shop-two-full-siren-3x3, shop-two-full-siren-5x5, shop-two-full-siren-7x7, shop-two-full-siren-grow]
variants: []
