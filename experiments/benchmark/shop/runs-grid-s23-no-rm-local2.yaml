# shop level grid, 2026-11-24: 36 runs of runs-grid-s23-no-rm.yaml (cluster jobs 56755, 56756 and 56757, cancelled before
# they started: the 18 cards serve, order, cook, siren x 4 sizes and falls-3x3, falls-5x5, no reward machine, seeds 2 and
# 3), moved to this machine. Same suite name, so the runs land in the same outputs/runs folders as the cluster ones.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-grid-s23-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # no-rm needs none
learner: ppo
learners:
  ppo:
    config: experiments/benchmark/configs/ppo-shop.yaml
    ram_gb: 3
    overrides: {rm_state_encoding: embedding}
arms: [no-rm]
seeds: [2, 3]
total_timesteps: 5000000
only: [shop-grid-serve-3x3, shop-grid-serve-5x5, shop-grid-serve-7x7, shop-grid-serve-grow, shop-grid-order-3x3, shop-grid-order-5x5, shop-grid-order-7x7, shop-grid-order-grow, shop-grid-cook-3x3, shop-grid-cook-5x5, shop-grid-cook-7x7, shop-grid-cook-grow, shop-grid-siren-3x3, shop-grid-siren-5x5, shop-grid-siren-7x7, shop-grid-siren-grow, shop-grid-falls-3x3, shop-grid-falls-5x5]
variants: []
