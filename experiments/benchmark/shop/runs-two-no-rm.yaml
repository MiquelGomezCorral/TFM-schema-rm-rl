# shop two jobs, 2026-11-25, no reward machine: the 16 cards, worlds, stages and steps of runs-two-farm.yaml (read its
# header: four tasks, each a serving job plus one hard part; the hard part off first, then on, at 3, 5, 7 and grown),
# trained on the shop's own reward (+1 per served order, the ring fine). The learner is the same shop preset
# ppo-shop.yaml; only rm_state_encoding goes back to its default, because one_hot needs a machine and this arm has none
# (config.py _validate_rm_state_encoding), so both arms share every PPO setting. 3 seeds. 16 cards x 3 seeds = 48 runs.
# Evaluation and the judge play the final world of each card. These cards are not among the counted 60 (train: false).
# Own suite name (own driver lock), so it runs beside the FARM suite.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-two-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # no-rm needs none
learner: ppo
learners:
  ppo:
    config: experiments/benchmark/configs/ppo-shop.yaml
    ram_gb: 3
    overrides: {rm_state_encoding: embedding}
arms: [no-rm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-two-serve-falls-3x3, shop-two-serve-falls-5x5, shop-two-serve-falls-7x7, shop-two-serve-falls-grow, shop-two-serve-siren-3x3, shop-two-serve-siren-5x5, shop-two-serve-siren-7x7, shop-two-serve-siren-grow, shop-two-full-falls-3x3, shop-two-full-falls-5x5, shop-two-full-falls-7x7, shop-two-full-falls-grow, shop-two-full-siren-3x3, shop-two-full-siren-5x5, shop-two-full-siren-7x7, shop-two-full-siren-grow]
variants: []
