# shop level grid, 2026-11-24: 12 runs of runs-grid-s23.yaml (cluster job 56753, cancelled before it started: siren-3x3,
# siren-5x5, siren-7x7, siren-grow, falls-3x3 and falls-5x5, FARM, seeds 2 and 3), moved to this machine. Same suite
# name, so the runs land in the same outputs/runs folders as the cluster ones.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-grid-s23
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-shop.yaml, ram_gb: 3}
arms: [farm]
seeds: [2, 3]
total_timesteps: 5000000
only: [shop-grid-siren-3x3, shop-grid-siren-5x5, shop-grid-siren-7x7, shop-grid-siren-grow, shop-grid-falls-3x3, shop-grid-falls-5x5]
variants: []
