# shop task curriculum, 2026-11-24, no reward machine: the card, stages, learner and steps of
# runs-task-curriculum-farm.yaml (read its header), the agent trained on the shop's own reward (+1 per served order, the
# ring fine). The learner is the shop preset ppo-shop.yaml; only rm_state_encoding goes back to its default, because
# one_hot needs a machine and this arm has none (config.py _validate_rm_state_encoding). 1 card x 3 seeds = 3 runs.
# Own suite name (own driver lock), so it can run beside the FARM arm.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-task-curriculum-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # no-rm needs none
learner: ppo
learners:
  ppo:
    config: experiments/benchmark/configs/ppo-shop.yaml
    ram_gb: 3
    overrides: {rm_state_encoding: embedding}
arms: [no-rm]
seeds: [1, 2, 3]
total_timesteps: 15000000
only: [shop-task-curriculum]
variants: []
