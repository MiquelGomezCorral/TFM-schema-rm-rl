# The 15M probe: shop-boil with ARM-FM, RM reward only.
# Train: python app/main.py run-suite --suite experiments/benchmark/shop/runs-boil-15m.yaml  (grid and reasons: README.md)
suite: shop-probe
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [arm-fm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 15000000
only: [shop-boil]
variants: []
