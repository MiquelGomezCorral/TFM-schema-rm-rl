# shop ladder in smaller shops, 2026-11-23. Not counted in the 60-card results (FP/shop-size.md). No-RM arm.
# Rungs 1-3 in a 3x3, 5x5 and 7x7 floor (cards `<ladder card>-<n>x<n>`, world copies with `area` in env_kwargs). One run
# per card: every card is its own world, so no sharing. Settings of the counted no-RM shop copies and of
# no-rm/shop-ladder.yaml: PPO s07 (ppo.yaml), 5M steps, 3 seeds, the env reward.
# Own suite name (own lock) beside farm/shop-size.yaml and farm/shop-size-std.yaml.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-size-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # no-rm needs none
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-ladder-deliver-3x3, shop-ladder-deliver-siren-3x3, shop-ladder-order-deliver-3x3, shop-ladder-deliver-5x5, shop-ladder-deliver-siren-5x5, shop-ladder-order-deliver-5x5, shop-ladder-deliver-7x7, shop-ladder-deliver-siren-7x7, shop-ladder-order-deliver-7x7]
variants: []
