# shop ladder world curriculum, 2026-11-23: FARM, one run, one machine, a world that gets harder while the agent learns.
# Rungs 1 and 3 (deliver; order and deliver), each in two forms (README, "Curriculum"):
#   <rung>-curriculum       no slips, then slips (today's world);
#   <rung>-curriculum-back  no slips, then slips, then slips plus 25% back falls (food lands behind the agent).
# The stage changes when the last 100 finished training episodes serve 10 orders on average (the back-fall stage also
# needs 90% of falls caught on the next move). Evaluation and the judge play the final world. The switches are in the
# run folder's stages.csv. Every card is a world copy of its base card (bundle_of): the base card's FARM machine, so the
# machine, the learner and the 5M steps are the ones of the plain runs. Not counted; settings never named in the paper.
# Same learner as the shop side tests (ppo-onehot.yaml: ppo.yaml with the RM state one-hot).
# 4 cards x 3 seeds = 12 runs, one cluster job.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-curriculum
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<card or bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-onehot.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-ladder-deliver-curriculum, shop-ladder-deliver-curriculum-back, shop-ladder-order-deliver-curriculum, shop-ladder-order-deliver-curriculum-back]
variants: []
