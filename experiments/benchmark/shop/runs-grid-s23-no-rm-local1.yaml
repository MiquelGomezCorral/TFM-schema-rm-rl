# shop level grid, 2026-11-24: the last 4 runs of runs-grid-s23-no-rm.yaml (cluster job 56758: falls-7x7 and
# falls-grow, no reward machine, seeds 2 and 3), moved to this machine. Same suite name, so the runs land in the
# same outputs/runs folders as the cluster ones.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-grid-s23-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # no-rm needs none
learner: ppo
learners:
  ppo:
    config: experiments/benchmark/configs/ppo-shop.yaml
    ram_gb: 3
    overrides: {rm_state_encoding: embedding}
arms: [no-rm]
seeds: [2, 3]
total_timesteps: 5000000
only: [shop-grid-falls-7x7, shop-grid-falls-grow]
variants: []
