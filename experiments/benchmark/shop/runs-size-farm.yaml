# shop ladder in smaller shops, 2026-11-23 (user: "make the shop smaller? like 7x7 or 5x5? or even 3x3"). Not counted in
# the 60-card results (FP/shop-size.md). FARM arm, the ladder's own settings.
# Rungs 1-3 (deliver, deliver + siren, order + deliver) in a 3x3, 5x5 and 7x7 floor: cards `<ladder card>-<n>x<n>` of
# experiments/benchmark/shop/tasks.json, world copies (`area` in env_kwargs) that train on their source card's FARM
# machine through bundle_of (the labeling reads events, not the room). 8x8 is shop-ladder.yaml's.
# Settings of FP/farm/shop-ladder.yaml (the counted FARM shop-serve copy): PPO P1 (ppo-shop.yaml, one-hot RM state),
# 5M steps, 3 seeds, RM reward only. 5M kept so a size is comparable with the 8x8 runs.
# Own suite name (own lock): shop-size. No-RM: no-rm/shop-size.yaml (suite shop-size-reward); standard settings:
# farm/shop-size-std.yaml (suite shop-size-std).
# Train: python app/main.py run-suite --suite <this file>
suite: shop-size
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<card or bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-shop.yaml, ram_gb: 3}   # P1, the shop runs that learned
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-ladder-deliver-3x3, shop-ladder-deliver-siren-3x3, shop-ladder-order-deliver-3x3, shop-ladder-deliver-5x5, shop-ladder-deliver-siren-5x5, shop-ladder-order-deliver-5x5, shop-ladder-deliver-7x7, shop-ladder-deliver-siren-7x7, shop-ladder-order-deliver-7x7]
variants: []
