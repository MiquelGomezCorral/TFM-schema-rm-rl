# shop task curriculum, 2026-11-24: one card, `shop-task-curriculum`, a world copy of shop-full (the full instruction set
# without the boiler; its FARM machine through bundle_of). Final world: area 7 with order, cooking, siren and slips on.
# Stages: 0 serve with order and cooking (area 3, no siren, no slips); 1 adds falling food (area 3, no siren); 2 adds the
# siren (area 3); 3 grows to area 5; then the final 7 x 7 world. A stage ends when the last 100 finished training episodes
# serve 60% of the scripted worker's mean in that stage's world, catch 90% of the falls when it has slips and switch off
# 90% of the sirens when it has the siren (README, "Curriculum"; the switches are in each run folder's stages.csv).
# FARM arm, 6 seeds, 15M steps, the shop preset ppo-shop.yaml (one-hot RM state). The no-reward-machine arm:
# runs-task-curriculum-no-rm.yaml. 1 card x 6 seeds = 6 runs.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-task-curriculum
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/shop-full/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-shop.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3, 4, 5, 6]
total_timesteps: 15000000
only: [shop-task-curriculum]
variants: []
