# shop ladder in smaller shops, 2026-11-23: FARM on the standard PPO settings (ppo.yaml, s07, as the no-RM runs) with the
# RM state one-hot (ppo-onehot.yaml, the user's rule: one-hot for tests), to see if a smaller shop lets FARM learn where
# the 8x8 one does not. Not counted; settings never named in the paper (user rule 2026-11-22). FP/shop-size.md.
# Rungs 1 and 3 only, like the 8x8 side test farm/shop-ladder-std.yaml (suite shop-ladder-std, which runs 8x8): the two
# rungs the no-RM arm learns there. Rung 2 would add 9 runs (shop-ladder-deliver-siren-<n>x<n>).
# Same world copies and FARM machines as farm/shop-size.yaml. 5M steps, 3 seeds, RM reward only.
# experiments/benchmark/configs/ppo-onehot.yaml is untracked in C at the time of writing: commit it with this file's suite.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-size-std
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<card or bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-onehot.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2, 3]
total_timesteps: 5000000
only: [shop-ladder-deliver-3x3, shop-ladder-order-deliver-3x3, shop-ladder-deliver-5x5, shop-ladder-order-deliver-5x5, shop-ladder-deliver-7x7, shop-ladder-order-deliver-7x7]
variants: []
