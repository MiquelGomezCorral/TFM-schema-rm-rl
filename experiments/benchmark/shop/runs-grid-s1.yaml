# shop level grid, 2026-11-24, FARM arm, seed 1: five task levels (serve, order, cook, siren, falls; each adds one thing to
# the last), each at area 3, 5 and 7 and grown (area 7 reached through 3 x 3 and 5 x 5), 20 cards `shop-grid-<level>-<size>`
# of experiments/benchmark/shop/tasks.json. Every card is a world copy of its level's machine card (bundle_of): serve
# shop-ladder-deliver, order shop-ladder-order-deliver, cook shop-serve, siren and falls shop-full. A grown card moves on
# when the last 100 finished training episodes serve 60% of the scripted worker's mean in that stage's world, catch 90%
# of the falls when the world has slips and switch off 90% of the sirens when it has the siren (README, "Curriculum").
# One learner, the shop preset ppo-shop.yaml (one-hot RM state), 5M steps. 20 cards x 1 seed = 20 runs.
# Same cards and learner settings: runs-grid-s1-no-rm.yaml (the shop's own reward); seeds 2 and 3: runs-grid-s23*.yaml.
# Train: python app/main.py run-suite --suite <this file>
suite: shop-grid-s1
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/farm/<bundle_of card>/
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo-shop.yaml, ram_gb: 3}
arms: [farm]
seeds: [1]
total_timesteps: 5000000
only: [shop-grid-serve-3x3, shop-grid-serve-5x5, shop-grid-serve-7x7, shop-grid-serve-grow, shop-grid-order-3x3, shop-grid-order-5x5, shop-grid-order-7x7, shop-grid-order-grow, shop-grid-cook-3x3, shop-grid-cook-5x5, shop-grid-cook-7x7, shop-grid-cook-grow, shop-grid-siren-3x3, shop-grid-siren-5x5, shop-grid-siren-7x7, shop-grid-siren-grow, shop-grid-falls-3x3, shop-grid-falls-5x5, shop-grid-falls-7x7, shop-grid-falls-grow]
variants: []
