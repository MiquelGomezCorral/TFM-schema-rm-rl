# Shop level 1 with the shop reward added to the RM reward.
# Train: python app/main.py run-suite --suite experiments/benchmark/shop/runs-level1-shop-reward.yaml  (grid and reasons: README.md)
suite: shop-reward
tasks: experiments/benchmark/shop/tasks.json
bundles: experiments/benchmark/shop/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo            # the learner of the tuning program (setting s07)
learners:
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 9}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [arm-fm, farm]
seeds: [1]              # target: [1, 2, 3]
total_timesteps: 1500000
only: [shop-siren]
variants: []
reward_source: both     # RM reward plus the shop reward (the env reward)
