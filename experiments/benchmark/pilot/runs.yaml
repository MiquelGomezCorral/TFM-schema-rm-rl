# Learner pilot: 2 base cards x {dqn, ppo} x 2 seeds, FARM machines, short runs = 8 runs.
# The decision rule was fixed before the runs; the winner goes into `learner:` of the
# other runs.yaml files. Run: scripts/train.sh pilot --parallel 8 --max-ram-gb 16 --time-box-min 50
suite: pilot
tasks: experiments/benchmark/pilot/tasks.json
bundles: experiments/benchmark/pilot/bundles    # <bundles>/farm/<card-id>/, copied in by the coordinator
learner: TBD            # unused here: compare_learners trains both
compare_learners: [dqn, ppo]
learners:
  # buffer 100000 instead of 1000000, so far less RAM than the full-suite estimate; the pilot measures it
  dqn: {config: experiments/benchmark/configs/dqn.yaml, ram_gb: 4, overrides: {buffer_size: 100000}}
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [farm]
seeds: [1, 2]           # the full suites target [1, 2, 3]
total_timesteps: 500000
time_box_min: 50
only: []                # empty = every card with train: true
variants: []
