# XLand ablation "no embeddings" on the 5-task mix (X1..X5): the machine pays as in the arm-fm arm,
# but the policy never sees the RM state (rm_state_encoding: none). 1 mix x 1 arm x 3 seeds = 3
# runs of 5M steps. No `only`: no XLand card has train: true, so the suite holds the mix alone.
suite: xland-mix5-noemb
tasks: experiments/benchmark/xland/tasks.json
bundles: experiments/benchmark/xland/bundles
learner: ppo-noemb
learners:
  ppo-noemb: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3, overrides: {rm_state_encoding: none}}
arms: [arm-fm]
seeds: [1, 2, 3]
total_timesteps: 5000000
variants: []
mixes:
  - {id: xland-mix5, cards: [xland-x1-197, xland-x2-212, xland-x3-260, xland-x4-859, xland-x5-594]}
