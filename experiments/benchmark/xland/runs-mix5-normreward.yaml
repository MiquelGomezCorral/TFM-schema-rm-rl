# XLand ablation "no RM reward" on the 5-task mix (X1..X5): the policy learns from the env reward
# alone; the arm-fm machine runs beside it only for its state embedding (reward_source:
# env_rm_state; the machine pays nothing and ends no episode). 1 mix x 1 arm x 3 seeds = 3 runs of
# 5M steps. No `only`: no XLand card has train: true, so the suite holds the mix alone.
suite: xland-mix5-normreward
tasks: experiments/benchmark/xland/tasks.json
bundles: experiments/benchmark/xland/bundles
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [arm-fm]
seeds: [1, 2, 3]
total_timesteps: 5000000
reward_source: env_rm_state
variants: []
mixes:
  - {id: xland-mix5, cards: [xland-x1-197, xland-x2-212, xland-x3-260, xland-x4-859, xland-x5-594]}
