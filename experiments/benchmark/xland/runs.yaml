# XLand suite: the ARM-FM paper's XLand experiments (Figures 9 and 10) on our three arms.
# Runs: 2 cards (X1 alone, ZC trained directly) + 3 mixes (X2+X1+X3; X1..X5; ZA+ZB), each x 3 arms
# x 3 seeds = 45 runs of 5M steps (user D3). The cards are XLand rulesets, so a mix's cards differ
# in env_kwargs and the mix gets a no-rm arm too. ZC zero-shot: test the ZA+ZB policies on ZC's
# machine with `test-rl --bundle` (README). The two mix ablations are runs-mix5-*.yaml.
suite: xland
tasks: experiments/benchmark/xland/tasks.json
bundles: experiments/benchmark/xland/bundles   # <bundles>/<arm>/<card-id>/ for arm-fm and farm
learner: ppo
learners:
  ppo: {config: experiments/benchmark/configs/ppo.yaml, ram_gb: 3}
arms: [no-rm, arm-fm, farm]
seeds: [1, 2, 3]
total_timesteps: 5000000   # every XLand run, a mix too (user D3)
only: [xland-x1-197, xland-zc]   # every XLand card has train: false, so only names them
variants: []
mixes:
  - {id: xland-mix3, cards: [xland-x2-212, xland-x1-197, xland-x3-260]}
  - {id: xland-mix5, cards: [xland-x1-197, xland-x2-212, xland-x3-260, xland-x4-859, xland-x5-594]}
  - {id: xland-zab, cards: [xland-za, xland-zb]}
