# CALIBRATED schedule (option A, 2026-10-14), not Table 5: learning starts 1k, epsilon 0.01 at 30k, gamma 0.95.
# ARM-FM paper reproduction: KeyCorridor S6R3, fixed layout (seed 1), the authors' released Reward Machine. Pass the seed with --seed.
exp_name: paper-key-corridor-s6r3-authors-cal-g95
gym_id: MiniGrid-KeyCorridorS6R3-v0
env_family: minigrid
observation: pixels
layout: fixed
layout_seed: 1  # the released labeling hard-codes the seed-1 colors
bundle: outputs/bundles/paper-authors-KeyCorridorS6R3

# ARM-FM Table 5 and the 300k-step budget of Fig 6 and 7.
total_timesteps: 300000
learning_starts: 1000  # calibrated: not Table 5 (80000)
eval_frequency: 10000
learning_rate: 1.0e-4
buffer_size: 300000  # equals the budget, so identical to 1e6 here
gamma: 0.95  # calibrated: not Table 5 (0.99)
tau: 1.0
target_network_frequency: 2500
batch_size: 32
start_e: 1.0
end_e: 0.01
exploration_fraction: 0.1  # calibrated: not Table 5 (0.35)
train_frequency: 4

eval_episodes: 10
final_eval_episodes: 100
eval_epsilon: 0.0
success_threshold: 0.9
