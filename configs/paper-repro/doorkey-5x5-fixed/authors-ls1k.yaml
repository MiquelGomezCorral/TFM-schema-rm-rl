# DIAGNOSTIC (not a verdict, learning_starts 1000 instead of Table 5): ARM-FM paper reproduction: DoorKey 5x5, fixed layout, the authors' released Reward Machine. Pass the seed with --seed.
exp_name: paper-doorkey-5x5-fixed-authors-ls1k
gym_id: MiniGrid-DoorKey-5x5-v0
env_family: minigrid
observation: pixels
layout: fixed
bundle: outputs/bundles/paper-authors-DoorKey

# ARM-FM Table 5 and the 300k-step budget of Fig 6 and 7.
total_timesteps: 300000
learning_starts: 1000  # diagnostic, not Table 5
eval_frequency: 10000
learning_rate: 1.0e-4
buffer_size: 300000  # equals the budget, so identical to 1e6 here
gamma: 0.99
tau: 1.0
target_network_frequency: 2500
batch_size: 32
start_e: 1.0
end_e: 0.01
exploration_fraction: 0.35
train_frequency: 4

eval_episodes: 10
final_eval_episodes: 100
eval_epsilon: 0.0
success_threshold: 0.9
