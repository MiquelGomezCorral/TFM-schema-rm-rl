# ARM-FM DQN run on MiniGrid-UnlockPickup-v0. Pass the seed with --seed.
exp_name: smoke-rm-symbolic
gym_id: MiniGrid-UnlockPickup-v0
env_family: minigrid
observation: symbolic
layout: fixed
use_rm: true
bundle: outputs/bundles/UnlockPickup-1

# Smoke budget; every other value is ARM-FM Table 5.
total_timesteps: 20000
learning_starts: 2000
eval_frequency: 5000
learning_rate: 1.0e-4
buffer_size: 1000000
gamma: 0.99
tau: 1.0
target_network_frequency: 2500
batch_size: 32
start_e: 1.0
end_e: 0.01
exploration_fraction: 0.35
train_frequency: 4

eval_episodes: 10
final_eval_episodes: 100
eval_epsilon: 0.0
success_threshold: 0.9
