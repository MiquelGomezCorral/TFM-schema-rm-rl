# Wave 3 / S3 (BabyAI ChosenMission smoke, all three missions in one run, paper, procedural layouts). Pass the seed with --seed.
exp_name: w3-babyai-paper-multi
gym_id: BabyAI-ChosenMission-v0
env_family: minigrid
observation: symbolic
layout: procedural
use_rm: true
task_bundles:
  - bundle: outputs/bundles/BabyAIMission-paper-M1
    labeling_bundle: outputs/bundles/BabyAIMission-M1
    env_kwargs: {mission: "put the yellow ball next to the red key"}
  - bundle: outputs/bundles/BabyAIMission-paper-M2
    labeling_bundle: outputs/bundles/BabyAIMission-M2
    env_kwargs: {mission: "open the green door, then pick up the blue box"}
  - bundle: outputs/bundles/BabyAIMission-paper-M3
    labeling_bundle: outputs/bundles/BabyAIMission-M3
    env_kwargs: {mission: "move the purple box to a corner, then put the yellow ball next to the red key"}
    success: rm
total_timesteps: 50000
learning_starts: 10000
eval_frequency: 10000
learning_rate: 1.0e-4
buffer_size: 1000000
gamma: 0.9
tau: 1.0
target_network_frequency: 2500
batch_size: 128
start_e: 1.0
end_e: 0.05
exploration_fraction: 0.2
train_frequency: 4
eval_episodes: 10
final_eval_episodes: 100
eval_epsilon: 0.0
success_threshold: 0.9
