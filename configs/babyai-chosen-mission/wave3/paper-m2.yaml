# Wave 3 / S3 (BabyAI ChosenMission smoke, mission M2, paper, procedural layouts). Pass the seed with --seed.
exp_name: w3-babyai-paper-m2
gym_id: BabyAI-ChosenMission-v0
env_family: minigrid
observation: symbolic
layout: procedural
bundle: outputs/bundles/BabyAIMission-paper-M2
