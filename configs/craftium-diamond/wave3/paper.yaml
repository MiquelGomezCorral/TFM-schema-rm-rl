algorithm: ppo
bundle: outputs/bundles/CraftiumDiamond-paper-1
labeling_bundle: outputs/bundles/CraftiumDiamond-1
env_kwargs:
  max_steps: 10000

total_timesteps: 50000
ppo_num_envs: 4
eval_frequency: 25000
eval_episodes: 2
final_eval_episodes: 2
