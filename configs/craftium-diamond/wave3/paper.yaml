# Wave 3 smoke: PPO on Craftium/Diamond-v0 with the ARM-FM (paper-style) Reward Machine. Its
# labeling comes from the compiler bundle (same environment.md). Pass the seed with --seed.
# Same budget and settings as sparse.yaml.
exp_name: w3-craftium-paper
gym_id: Craftium/Diamond-v0
