# Wave 3 smoke: PPO on Craftium/Diamond-v0 without a Reward Machine (sparse diamond reward).
# Pass the seed with --seed. The world is fixed (same map every episode); Craftium's frames reach
# the agent as 84x84 grayscale x4, so `observation` is not used. Smoke budget: 50,000 agent steps
# over 4 envs; every PPO value is ARM-FM Table 6 (the ppo_* defaults).
exp_name: w3-craftium-sparse
gym_id: Craftium/Diamond-v0
env_family: craftium
algorithm: ppo
reward_source: env
env_kwargs:
  max_steps: 10000

total_timesteps: 50000
ppo_num_envs: 4
eval_frequency: 25000
eval_episodes: 2
final_eval_episodes: 2
