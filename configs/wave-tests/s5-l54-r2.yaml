# Wave test s5 L5.4 copy of configs/paper-repro/doorkey-8x8-random/ours.yaml. `bundle` was a scratch copy of the
# FARM DoorKey pilot bundle; rerun with it replaced by experiments/benchmark/base/bundles/farm/base-doorkey.
# Changed only: total_timesteps (5000), bundle (FARM DoorKey pilot), layout (fixed), layout_seed (1), exp_name.
exp_name: wave-tests-s5-l54-r2
gym_id: MiniGrid-DoorKey-8x8-v0
env_family: minigrid
observation: pixels
layout: fixed
layout_seed: 1
bundle: outputs/wave-tests/s5/bundles/farm/base-doorkey

# Smoke budget for the judge test; every other value is copied from ARM-FM Table 5 (ours.yaml).
total_timesteps: 5000
learning_starts: 1000
eval_frequency: 10000
learning_rate: 1.0e-4
buffer_size: 300000
gamma: 0.99
tau: 1.0
target_network_frequency: 2500
batch_size: 32
start_e: 1.0
end_e: 0.01
exploration_fraction: 0.35
train_frequency: 4

eval_episodes: 3
final_eval_episodes: 100
eval_epsilon: 0.0
success_threshold: 0.9
